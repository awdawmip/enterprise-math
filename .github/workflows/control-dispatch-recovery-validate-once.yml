# one-shot rerun 6
name: control-dispatch-recovery-validate-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-dispatch-recovery-validate-once.yml'

permissions:
  contents: write
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Retire three stale raw-alias authority quarantines
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('research_driver_review_authority_quarantines.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          retire = {
              'DR-58E2B5C0EC95B39C59CF',
              'DR-A09122DB8ECD450507DD',
              'DR-C5539B165E52AAAA3C6A',
          }
          rows = payload['entries']
          found = {row.get('review_id') for row in rows} & retire
          if found != retire:
              raise SystemExit(f'expected exact quarantine rows missing: found={sorted(found)}')
          payload['entries'] = [row for row in rows if row.get('review_id') not in retire]
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('RETIRED=' + ','.join(sorted(retire)))
          PY
          python - <<'PY'
          from control_plane import research_result_review_audit_fault_isolation as invalid
          from control_plane import research_result_review_binding_fault_isolation as binding
          from control_plane import research_driver_review_authority_compat_runtime as compat
          from control_plane import research_driver_review_authority_fault_isolation as authority_isolation
          invalid.install()
          binding.install()
          compat.install()
          authority_isolation.install()
          print('AUTHORITY_QUARANTINE_AFTER_RETIRE=PASS')
          PY
          git config user.name 'awdawmip'
          git config user.email '30957095+awdawmip@users.noreply.github.com'
          git add research_driver_review_authority_quarantines.json
          git commit -m 'control: retire quarantines resolved by exact raw authority aliases'
          git push origin HEAD:main
      - name: Classify operational Driver authority leaks
        run: |
          python - <<'PY'
          import json
          from control_plane import research_control_bootstrap as bootstrap
          bootstrap.install()
          import research_driver_authority as authority
          from tools import research_result_records
          unresolved = []
          for review in research_result_records.iter_reviews():
              errors = authority.review_authority_errors(review)
              if not errors:
                  continue
              driver_id = review.get('driver_id')
              reviewed_at = review.get('reviewed_at')
              active = None
              if isinstance(driver_id, str) and isinstance(reviewed_at, str):
                  try:
                      active = authority.require_active_driver(driver_id, reviewed_at)
                  except Exception as exc:
                      active = {'lookup_error': str(exc)}
              unresolved.append({
                  'review_id': review.get('review_id'),
                  'result_id': review.get('result_id'),
                  'task_id': review.get('task_id'),
                  'driver_id': driver_id,
                  'reviewed_at': reviewed_at,
                  'pinned_authority_record_id': review.get('driver_authority_record_id'),
                  'pinned_source_comment_id': review.get('driver_authority_source_comment_id'),
                  'active_authority_record_id': active.get('authority_record_id') if isinstance(active, dict) else None,
                  'active_raw_authority_record_id': active.get('_raw_authority_record_id') if isinstance(active, dict) else None,
                  'active_source_comment_id': active.get('source_comment_id') if isinstance(active, dict) else None,
                  'errors': errors,
              })
          print('OPERATIONAL_AUTHORITY_ERRORS=' + json.dumps(unresolved, ensure_ascii=False, sort_keys=True))
          if unresolved:
              raise SystemExit(f'operational Driver authority leaks remain: {len(unresolved)}')
          print('RUNTIME_BOOTSTRAP=PASS')
          print('OPERATIONAL_DRIVER_AUTHORITY=PASS')
          PY
      - name: Fetch raw Issue 240 runtime stream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp 'repos/awdawmip/enterprise-math/issues/240/comments?per_page=100' > /tmp/comment-pages.json
          python - <<'PY'
          import json
          pages = json.load(open('/tmp/comment-pages.json', encoding='utf-8'))
          comments = [row for page in pages for row in page]
          json.dump(comments, open('/tmp/comments.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('RAW_COMMENT_COUNT=' + str(len(comments)))
          PY
      - name: Run canonical dispatcher read-only
        run: |
          set +e
          python research_control_dispatch.py --events /tmp/comments.json --kind RESEARCH > /tmp/dispatch.json
          rc=$?
          set -e
          cat /tmp/dispatch.json
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          echo "DISPATCH_EXIT_CODE=$rc"
