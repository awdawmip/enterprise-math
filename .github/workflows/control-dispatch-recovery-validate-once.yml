# one-shot rerun 9
name: control-dispatch-recovery-validate-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-dispatch-recovery-validate-once.yml'

permissions:
  contents: write
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install one-result-state-per-task optimization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/research_dispatch.py')
          text = path.read_text(encoding='utf-8')

          old_filter = '''def _filter_registered_events(\n    task: dict[str, Any], events: list[dict[str, Any]], root: Path\n) -> tuple[list[dict[str, Any]], list[dict[str, Any]]]:\n    if not _is_registered(task):\n        return events, []\n    result_state = research_result_records.task_result_state(task["task_id"], root)\n'''
          new_filter = '''def _filter_registered_events(\n    task: dict[str, Any],\n    events: list[dict[str, Any]],\n    root: Path,\n    result_state: dict[str, Any] | None,\n) -> tuple[list[dict[str, Any]], list[dict[str, Any]]]:\n    if not _is_registered(task):\n        return events, []\n'''
          if old_filter not in text:
              raise SystemExit('registered-event filter anchor missing')
          text = text.replace(old_filter, new_filter, 1)

          old_overlay = '''def _overlay_result_state(\n    task: dict[str, Any], state: dict[str, Any], root: Path\n) -> dict[str, Any]:\n    if not _is_registered(task):\n        return state\n    result_state = research_result_records.task_result_state(task["task_id"], root)\n'''
          new_overlay = '''def _overlay_result_state(\n    task: dict[str, Any],\n    state: dict[str, Any],\n    root: Path,\n    result_state: dict[str, Any] | None,\n) -> dict[str, Any]:\n    if not _is_registered(task):\n        return state\n'''
          if old_overlay not in text:
              raise SystemExit('result overlay anchor missing')
          text = text.replace(old_overlay, new_overlay, 1)

          old_reduce = '''    authenticated, auth_rejected = _event_authentication_filter(task, events)\n    filtered, registered_rejected = _filter_registered_events(task, authenticated, root)\n    lease = int(task.get("claim_lease_minutes") or default_lease_minutes)\n'''
          new_reduce = '''    authenticated, auth_rejected = _event_authentication_filter(task, events)\n    result_state = None\n    if _is_registered(task):\n        publication_id = task.get("publication_id")\n        result_state = research_result_records.task_result_state(\n            task["task_id"],\n            root,\n            publication_id if isinstance(publication_id, str) else None,\n        )\n    filtered, registered_rejected = _filter_registered_events(\n        task, authenticated, root, result_state\n    )\n    lease = int(task.get("claim_lease_minutes") or default_lease_minutes)\n'''
          if old_reduce not in text:
              raise SystemExit('reduce-definition anchor missing')
          text = text.replace(old_reduce, new_reduce, 1)

          old_tail = '    state = _overlay_result_state(task, state, root)\n'
          new_tail = '    state = _overlay_result_state(task, state, root, result_state)\n'
          if old_tail not in text:
              raise SystemExit('overlay call anchor missing')
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/research_dispatch.py research_control_dispatch.py
          python - <<'PY'
          from pathlib import Path
          text = Path('tools/research_dispatch.py').read_text(encoding='utf-8')
          assert text.count('research_result_records.task_result_state(') == 1
          assert 'task, authenticated, root, result_state' in text
          assert '_overlay_result_state(task, state, root, result_state)' in text
          print('ONE_RESULT_STATE_PER_TASK_PATCH=PASS')
          PY
          git config user.name 'awdawmip'
          git config user.email '30957095+awdawmip@users.noreply.github.com'
          git add tools/research_dispatch.py
          git commit -m 'control: reuse one result lifecycle state per task'
          git push origin HEAD:main
      - name: Validate operational control prerequisites
        run: |
          python - <<'PY'
          import json
          from control_plane import research_control_bootstrap as bootstrap
          bootstrap.install()
          import research_driver_authority as authority
          from tools import research_result_records
          unresolved = []
          for review in research_result_records.iter_reviews():
              errors = authority.review_authority_errors(review)
              if errors:
                  unresolved.append({'review_id': review.get('review_id'), 'errors': errors})
          print('OPERATIONAL_AUTHORITY_ERRORS=' + json.dumps(unresolved, ensure_ascii=False, sort_keys=True))
          if unresolved:
              raise SystemExit(f'operational Driver authority leaks remain: {len(unresolved)}')
          print('RUNTIME_BOOTSTRAP=PASS')
          print('OPERATIONAL_DRIVER_AUTHORITY=PASS')
          PY
      - name: Fetch raw Issue 240 runtime stream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp 'repos/awdawmip/enterprise-math/issues/240/comments?per_page=100' > /tmp/comment-pages.json
          python - <<'PY'
          import json
          pages = json.load(open('/tmp/comment-pages.json', encoding='utf-8'))
          comments = [row for page in pages for row in page]
          json.dump(comments, open('/tmp/comments.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('RAW_COMMENT_COUNT=' + str(len(comments)))
          PY
      - name: Run canonical dispatcher read-only
        run: |
          set +e
          /usr/bin/time -f 'DISPATCH_WALL_SECONDS=%e' python research_control_dispatch.py --events /tmp/comments.json --kind RESEARCH > /tmp/dispatch.json
          rc=$?
          set -e
          cat /tmp/dispatch.json
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          echo "DISPATCH_EXIT_CODE=$rc"
