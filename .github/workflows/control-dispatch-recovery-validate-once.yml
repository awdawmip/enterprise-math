# one-shot rerun 8
name: control-dispatch-recovery-validate-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-dispatch-recovery-validate-once.yml'

permissions:
  contents: write
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install per-dispatch result/review read snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/research_dispatch.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'import re\nfrom datetime import datetime, timezone\n'
          new_import = 'import re\nfrom contextlib import contextmanager\nfrom datetime import datetime, timezone\n'
          if old_import not in text:
              raise SystemExit('contextmanager import anchor missing')
          text = text.replace(old_import, new_import, 1)

          old = '''def effective_states(\n    events: list[dict[str, Any]], *, now: datetime, root: Path = ROOT\n) -> list[dict[str, Any]]:\n    return [\n        reduce_definition(task, events, now=now, root=root)\n        for task in merged_definitions(root)\n    ]\n'''
          new = '''@contextmanager\ndef _dispatch_result_read_snapshot(root: Path = ROOT):\n    \"\"\"Cache the operational Result/Review file view for one derived-state pass.\n\n    Canonical dispatch is read-only.  Without this bounded cache, every task's\n    result-state overlay rescans the complete immutable Result/Review stores,\n    turning one dispatch into repeated repository-wide I/O.  The original\n    functions are restored immediately after this effective-state derivation, so\n    writers and later calls always observe fresh repository bytes.\n    \"\"\"\n    base_results = research_result_records.iter_results\n    base_reviews = research_result_records.iter_reviews\n    cached_results = tuple(base_results(root))\n    cached_reviews = tuple(base_reviews(root))\n    target_root = root.resolve()\n\n    def iter_results(local_root: Path = research_result_records.ROOT):\n        if local_root.resolve() != target_root:\n            return base_results(local_root)\n        return list(cached_results)\n\n    def iter_reviews(local_root: Path = research_result_records.ROOT):\n        if local_root.resolve() != target_root:\n            return base_reviews(local_root)\n        return list(cached_reviews)\n\n    research_result_records.iter_results = iter_results\n    research_result_records.iter_reviews = iter_reviews\n    try:\n        yield\n    finally:\n        research_result_records.iter_results = base_results\n        research_result_records.iter_reviews = base_reviews\n\n\ndef effective_states(\n    events: list[dict[str, Any]], *, now: datetime, root: Path = ROOT\n) -> list[dict[str, Any]]:\n    with _dispatch_result_read_snapshot(root):\n        return [\n            reduce_definition(task, events, now=now, root=root)\n            for task in merged_definitions(root)\n        ]\n'''
          if old not in text:
              raise SystemExit('effective_states anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/research_dispatch.py research_control_dispatch.py
          python - <<'PY'
          from pathlib import Path
          text = Path('tools/research_dispatch.py').read_text(encoding='utf-8')
          assert '_dispatch_result_read_snapshot' in text
          assert 'with _dispatch_result_read_snapshot(root):' in text
          print('DISPATCH_RESULT_SNAPSHOT_PATCH=PASS')
          PY
          git config user.name 'awdawmip'
          git config user.email '30957095+awdawmip@users.noreply.github.com'
          git add tools/research_dispatch.py
          git commit -m 'control: cache result and review reads per dispatch'
          git push origin HEAD:main
      - name: Validate operational control prerequisites
        run: |
          python - <<'PY'
          import json
          from control_plane import research_control_bootstrap as bootstrap
          bootstrap.install()
          import research_driver_authority as authority
          from tools import research_result_records
          unresolved = []
          for review in research_result_records.iter_reviews():
              errors = authority.review_authority_errors(review)
              if errors:
                  unresolved.append({'review_id': review.get('review_id'), 'errors': errors})
          print('OPERATIONAL_AUTHORITY_ERRORS=' + json.dumps(unresolved, ensure_ascii=False, sort_keys=True))
          if unresolved:
              raise SystemExit(f'operational Driver authority leaks remain: {len(unresolved)}')
          print('RUNTIME_BOOTSTRAP=PASS')
          print('OPERATIONAL_DRIVER_AUTHORITY=PASS')
          PY
      - name: Fetch raw Issue 240 runtime stream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp 'repos/awdawmip/enterprise-math/issues/240/comments?per_page=100' > /tmp/comment-pages.json
          python - <<'PY'
          import json
          pages = json.load(open('/tmp/comment-pages.json', encoding='utf-8'))
          comments = [row for page in pages for row in page]
          json.dump(comments, open('/tmp/comments.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('RAW_COMMENT_COUNT=' + str(len(comments)))
          PY
      - name: Run canonical dispatcher read-only
        run: |
          set +e
          /usr/bin/time -f 'DISPATCH_WALL_SECONDS=%e' python research_control_dispatch.py --events /tmp/comments.json --kind RESEARCH > /tmp/dispatch.json
          rc=$?
          set -e
          cat /tmp/dispatch.json
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          echo "DISPATCH_EXIT_CODE=$rc"
