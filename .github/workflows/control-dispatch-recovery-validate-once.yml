# one-shot rerun 7
name: control-dispatch-recovery-validate-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-dispatch-recovery-validate-once.yml'

permissions:
  contents: write
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install single-snapshot dispatch optimization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research_control_dispatch.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from tools import research_runtime\n'
          new_import = 'from tools import research_runtime\nfrom tools import research_runtime_reducer\n'
          if old_import not in text:
              raise SystemExit('runtime import anchor missing')
          text = text.replace(old_import, new_import, 1)

          old_leased = '''def _leased_targets(\n    events: list[dict[str, Any]], *, now, kind: str, root: Path\n) -> list[dict[str, Any]]:\n    targets: list[dict[str, Any]] = []\n    states = research_dispatch.effective_states(events, now=now, root=root)\n'''
          new_leased = '''def _leased_targets(\n    events: list[dict[str, Any]],\n    *,\n    now,\n    kind: str,\n    root: Path,\n    states: list[dict[str, Any]] | None = None,\n) -> list[dict[str, Any]]:\n    targets: list[dict[str, Any]] = []\n    if states is None:\n        states = research_dispatch.effective_states(events, now=now, root=root)\n'''
          if old_leased not in text:
              raise SystemExit('leased-target anchor missing')
          text = text.replace(old_leased, new_leased, 1)

          old_lane = '''def _fresh_lane(\n    events: list[dict[str, Any]], *, now, kind: str, root: Path\n) -> dict[str, Any] | None:\n    candidates: list[dict[str, Any]] = []\n    for state in research_dispatch.effective_states(events, now=now, root=root):\n'''
          new_lane = '''def _fresh_lane(\n    events: list[dict[str, Any]],\n    *,\n    now,\n    kind: str,\n    root: Path,\n    states: list[dict[str, Any]] | None = None,\n) -> dict[str, Any] | None:\n    candidates: list[dict[str, Any]] = []\n    if states is None:\n        states = research_dispatch.effective_states(events, now=now, root=root)\n    for state in states:\n'''
          if old_lane not in text:
              raise SystemExit('fresh-lane anchor missing')
          text = text.replace(old_lane, new_lane, 1)

          old_route = '''    observations = observations or {}\n    leased = _leased_targets(events, now=now, kind=kind, root=root)\n    fresh_task = research_dispatch.select_task(events, now=now, kind=kind, root=root)\n    fresh_lane = _fresh_lane(events, now=now, kind=kind, root=root)\n'''
          new_route = '''    observations = observations or {}\n    # One immutable derived task-state snapshot per canonical dispatch.  The old\n    # route recomputed the full Issue #240 stream independently for leased-owner,\n    # fresh-task, and fresh-lane selection.  Reusing one snapshot is semantics-\n    # preserving because all three selectors share the same events/now/root.\n    states = research_dispatch.effective_states(events, now=now, root=root)\n    leased = _leased_targets(events, now=now, kind=kind, root=root, states=states)\n    policy = research_runtime_reducer.load_policy(root)\n    fresh_task = research_runtime_reducer.select_state(states, policy, kind=kind)\n    fresh_lane = _fresh_lane(events, now=now, kind=kind, root=root, states=states)\n'''
          if old_route not in text:
              raise SystemExit('route-control anchor missing')
          text = text.replace(old_route, new_route, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile research_control_dispatch.py
          python - <<'PY'
          from pathlib import Path
          text = Path('research_control_dispatch.py').read_text(encoding='utf-8')
          if text.count('states = research_dispatch.effective_states(events, now=now, root=root)') != 3:
              # one in each fallback helper plus one canonical route snapshot
              raise SystemExit('unexpected effective_states call count after patch')
          print('SINGLE_SNAPSHOT_PATCH=PASS')
          PY
          git config user.name 'awdawmip'
          git config user.email '30957095+awdawmip@users.noreply.github.com'
          git add research_control_dispatch.py
          git commit -m 'control: reuse one derived state snapshot per dispatch'
          git push origin HEAD:main
      - name: Validate operational control prerequisites
        run: |
          python - <<'PY'
          import json
          from control_plane import research_control_bootstrap as bootstrap
          bootstrap.install()
          import research_driver_authority as authority
          from tools import research_result_records
          unresolved = []
          for review in research_result_records.iter_reviews():
              errors = authority.review_authority_errors(review)
              if errors:
                  unresolved.append({'review_id': review.get('review_id'), 'errors': errors})
          print('OPERATIONAL_AUTHORITY_ERRORS=' + json.dumps(unresolved, ensure_ascii=False, sort_keys=True))
          if unresolved:
              raise SystemExit(f'operational Driver authority leaks remain: {len(unresolved)}')
          print('RUNTIME_BOOTSTRAP=PASS')
          print('OPERATIONAL_DRIVER_AUTHORITY=PASS')
          PY
      - name: Fetch raw Issue 240 runtime stream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp 'repos/awdawmip/enterprise-math/issues/240/comments?per_page=100' > /tmp/comment-pages.json
          python - <<'PY'
          import json
          pages = json.load(open('/tmp/comment-pages.json', encoding='utf-8'))
          comments = [row for page in pages for row in page]
          json.dump(comments, open('/tmp/comments.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('RAW_COMMENT_COUNT=' + str(len(comments)))
          PY
      - name: Run canonical dispatcher read-only
        run: |
          set +e
          time python research_control_dispatch.py --events /tmp/comments.json --kind RESEARCH > /tmp/dispatch.json
          rc=$?
          set -e
          cat /tmp/dispatch.json
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          echo "DISPATCH_EXIT_CODE=$rc"
