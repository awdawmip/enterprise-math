# one-shot rerun 10
name: control-dispatch-recovery-validate-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-dispatch-recovery-validate-once.yml'

permissions:
  contents: write
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install lazy execution-intent lease compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/research_dispatch.py')
          text = path.read_text(encoding='utf-8')
          old = '''                normalized = copy.deepcopy(event)\n                normalized["researcher_id"] = intent["researcher_id"]\n                normalized.setdefault("lease_minutes", intent["owner_lease_minutes"])\n                accepted.append(normalized)\n                continue\n'''
          new = '''                normalized = copy.deepcopy(event)\n                normalized["researcher_id"] = intent["researcher_id"]\n                # Historical execution intents may predate owner_lease_minutes.\n                # Preserve an authenticated CLAIM-provided lease unchanged; only\n                # consult the intent when the CLAIM omitted it.  If both are\n                # absent, reject rather than inventing a lease.\n                if "lease_minutes" not in normalized:\n                    intent_lease = intent.get("owner_lease_minutes")\n                    if type(intent_lease) is not int or intent_lease <= 0:\n                        rejected.append({\n                            "index": index,\n                            "reason": (\n                                "registered CLAIM and historical execution intent both "\n                                "omit a positive owner lease"\n                            ),\n                        })\n                        continue\n                    normalized["lease_minutes"] = intent_lease\n                accepted.append(normalized)\n                continue\n'''
          if old not in text:
              raise SystemExit('execution-intent lease anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/research_dispatch.py research_control_dispatch.py
          python - <<'PY'
          from pathlib import Path
          text = Path('tools/research_dispatch.py').read_text(encoding='utf-8')
          assert 'historical execution intent both' in text
          assert 'normalized.setdefault("lease_minutes", intent["owner_lease_minutes"])' not in text
          print('LAZY_INTENT_LEASE_PATCH=PASS')
          PY
          git config user.name 'awdawmip'
          git config user.email '30957095+awdawmip@users.noreply.github.com'
          git add tools/research_dispatch.py
          git commit -m 'control: handle legacy intents without eager lease lookup'
          git push origin HEAD:main
      - name: Validate operational control prerequisites
        run: |
          python - <<'PY'
          import json
          from control_plane import research_control_bootstrap as bootstrap
          bootstrap.install()
          import research_driver_authority as authority
          from tools import research_result_records
          unresolved = []
          for review in research_result_records.iter_reviews():
              errors = authority.review_authority_errors(review)
              if errors:
                  unresolved.append({'review_id': review.get('review_id'), 'errors': errors})
          print('OPERATIONAL_AUTHORITY_ERRORS=' + json.dumps(unresolved, ensure_ascii=False, sort_keys=True))
          if unresolved:
              raise SystemExit(f'operational Driver authority leaks remain: {len(unresolved)}')
          print('RUNTIME_BOOTSTRAP=PASS')
          print('OPERATIONAL_DRIVER_AUTHORITY=PASS')
          PY
      - name: Fetch raw Issue 240 runtime stream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp 'repos/awdawmip/enterprise-math/issues/240/comments?per_page=100' > /tmp/comment-pages.json
          python - <<'PY'
          import json
          pages = json.load(open('/tmp/comment-pages.json', encoding='utf-8'))
          comments = [row for page in pages for row in page]
          json.dump(comments, open('/tmp/comments.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('RAW_COMMENT_COUNT=' + str(len(comments)))
          PY
      - name: Run canonical dispatcher read-only
        run: |
          set +e
          /usr/bin/time -f 'DISPATCH_WALL_SECONDS=%e' python research_control_dispatch.py --events /tmp/comments.json --kind RESEARCH > /tmp/dispatch.json
          rc=$?
          set -e
          cat /tmp/dispatch.json
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          echo "DISPATCH_EXIT_CODE=$rc"
