name: control-plane-concurrency-probe

on:
  push:
    branches:
      - control/adversarial-control-simulation-20260906
    paths:
      - '.github/workflows/control-plane-concurrency-probe.yml'
      - 'control_plane/concurrency_probe_trigger.txt'

concurrency:
  group: control-plane-concurrency-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hold runs so overlap is observable
        run: |
          echo "start=$GITHUB_SHA"
          sleep 25
          echo "finish=$GITHUB_SHA"
