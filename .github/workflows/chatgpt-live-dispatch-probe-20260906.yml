name: chatgpt-live-dispatch-probe-20260906

on:
  pull_request:
    paths:
      - '.github/workflows/chatgpt-live-dispatch-probe-20260906.yml'

permissions:
  contents: read

jobs:
  validate-pcf7-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run persisted PCF7 replication checker
        shell: bash
        run: |
          git fetch origin fa787241802ad4ad90d29d089e5a0665ec66916d
          git checkout --detach fa787241802ad4ad90d29d089e5a0665ec66916d
          python research_checks/PRIME_COORD_FACTOR_COMPLEXITY_FAILURE_CLASSIFICATION_STATEMENT_CORRECTION_REPLICATION_CHECK_20260906.py
