name: exact-arithmetic-runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Static BRC arithmetic policy gate
        run: >-
          python tools/check_exact_arithmetic_policy.py
          src/enterprise_math/exact_arithmetic.py
          src/enterprise_math/brc_logarithm.py
          tests/test_exact_arithmetic_brc_runtime.py
          tests/test_brc_logarithm_runtime.py
      - name: Exact arithmetic BRC runtime regression
        env:
          PYTHONPATH: src
        run: >-
          python tests/test_exact_arithmetic_brc_runtime.py &&
          python tests/test_brc_logarithm_runtime.py
