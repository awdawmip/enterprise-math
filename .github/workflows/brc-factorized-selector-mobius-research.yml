name: brc-factorized-selector-mobius-research

on:
  pull_request:
    paths:
      - "experiments/brc_factorized_selector_mobius_check.py"
      - "research_notes/BRC_FACTORIZED_SELECTOR_MOBIUS_CALCULUS_20260904.md"
      - ".github/workflows/brc-factorized-selector-mobius-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exact factorized selector Möbius checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_factorized_selector_mobius_check.py
