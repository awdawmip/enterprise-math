name: brc-newton-selector-event-avoiding-path-research

on:
  pull_request:
    paths:
      - "experiments/brc_newton_selector_event_avoiding_path_check.py"
      - "research_notes/BRC_NEWTON_SELECTOR_EVENT_AVOIDING_PATH_CERTIFICATE_20260904.md"
      - ".github/workflows/brc-newton-selector-event-avoiding-path-research.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exact selector event-avoiding path certificate checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_newton_selector_event_avoiding_path_check.py
