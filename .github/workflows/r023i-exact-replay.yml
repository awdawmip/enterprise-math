name: r023i-exact-replay

on:
  push:
    branches:
      - agent/r023i-brc-narrow-shared-surface
    paths:
      - '.github/workflows/r023i-exact-replay.yml'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/r023i-brc-narrow-shared-surface
          fetch-depth: 1

      - name: Replay frozen payload and validate shared-surface delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EM-R023I-D7ABB0"
          git config user.email "30957095+awdawmip@users.noreply.github.com"
          FROZEN_COMMIT=6eea57de1d30d6c2fe983121f6e209286a5c9895
          FROZEN_BLOB=9905df19ce6f7dd79864384362487cc8f54c3349
          git fetch --depth=1 origin "$FROZEN_COMMIT" || git fetch --depth=64 origin agent/r023-brc-semantic-lean-core
          mkdir -p EnterpriseMath/Relation
          git show "$FROZEN_COMMIT":EnterpriseMath/Relation/BranchRecoalescence.lean > EnterpriseMath/Relation/BranchRecoalescence.lean
          test "$(git hash-object EnterpriseMath/Relation/BranchRecoalescence.lean)" = "$FROZEN_BLOB"

          : > /tmp/r023i-patch.b64
          printf '%s' '' >> /tmp/r023i-patch.b64
          printf '%s' '' >> /tmp/r023i-patch.b64
          printf '%s' '' >> /tmp/r023i-patch.b64
          printf '%s' '' >> /tmp/r023i-patch.b64
          printf '%s' '' >> /tmp/r023i-patch.b64
          base64 -d /tmp/r023i-patch.b64 > /tmp/r023i-patch.py
          python /tmp/r023i-patch.py

          python -m json.tool research_common_surface.json >/dev/null
          python tools/check_bilingual_pairs.py
          python tools/check_references.py
          set +e
          COMMON_OUT="$(python tools/check_research_common_surface.py 2>&1)"
          COMMON_STATUS=$?
          set -e
          printf '%s\n' "$COMMON_OUT"
          if [ "$COMMON_STATUS" -ne 0 ]; then
            EXPECTED="research common surface: FAIL: repository tool index drift: missing_from_common_surface=['tools/research_identity.py', 'tools/research_taskbook.py']; stale_in_common_surface=[]"
            test "$COMMON_OUT" = "$EXPECTED"
          fi
          git diff --check
          test "$(git hash-object EnterpriseMath/Relation/BranchRecoalescence.lean)" = "$FROZEN_BLOB"

          git rm .github/workflows/r023i-exact-replay.yml
          git add EnterpriseMath/Relation/BranchRecoalescence.lean EnterpriseMath.lean research_common_surface.json docs/RESEARCH_COMMON_SURFACE.en.md docs/RESEARCH_COMMON_SURFACE.zh-CN.md docs/R023I_BRC_SHARED_SURFACE_RETURN.md
          git diff --cached --name-only
          git commit -m "[EM-R023I-D7ABB0] replay BRC shared surface"
          git push origin HEAD:agent/r023i-brc-narrow-shared-surface
