name: X6 signed spatial V16 checks

on:
  workflow_dispatch:

jobs:
  exact-signed-x6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Signed X6 exact regression
        run: python experiments/x6_signed_native_spatial_v16_20260905/check_x6_signed.py
      - name: Signed BRC endpoint kernel and primitive-line regression
        run: python experiments/x6_signed_native_spatial_v16_20260905/check_signed_brc.py
