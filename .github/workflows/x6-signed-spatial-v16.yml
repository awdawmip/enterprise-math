name: X6 signed spatial V16 checks

on:
  pull_request:
    paths:
      - 'research_notes/X6_P000_V4_SIGNED_AXIS_REFOUNDATION_V16_20260905.md'
      - 'definitions/ENTERPRISE_X6_SIGNED_NATIVE_SPATIAL_CELL_TORSOR_CANDIDATE_20260905.md'
      - 'experiments/x6_signed_native_spatial_v16_20260905/**'
      - '.github/workflows/x6-signed-spatial-v16.yml'
  workflow_dispatch:

jobs:
  exact-signed-x6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Signed X6 exact regression
        run: python experiments/x6_signed_native_spatial_v16_20260905/check_x6_signed.py
