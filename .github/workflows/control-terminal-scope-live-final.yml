name: control-terminal-scope-live-final

on:
  push:
    branches:
      - control/terminal-scope-review-barrier-20260907
    paths:
      - '.github/workflows/control-terminal-scope-live-final.yml'

permissions:
  contents: write
  issues: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Replay current Issue 240 and enforce no fresh review-return leak
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/issues/240/comments?per_page=100" \
            --jq '.[]' | jq -s '.' > /tmp/issue240.json
          set +e
          python research_control_dispatch.py --events /tmp/issue240.json --kind RESEARCH > /tmp/route.json
          rc=$?
          set -e
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then
            cat /tmp/route.json
            exit "$rc"
          fi
          count="$(jq length /tmp/issue240.json)"
          jq --argjson count "$count" '{issue_comments:$count,action,target_key,target:(.target // null | {task_id,publication_id,state,dispatch_state,claim_id,researcher_id,result_id,driver_disposition,next_action,hard_block})}' /tmp/route.json
          if jq -e '.action == "CLAIM_NEW_OWNER" and (.target_key == "RS-P021-FOCUSING-DIRECTION" or .target_key == "RS-PCF-RESTRICTED-ROUTES-EXTERNAL-PRIOR-ART-DUPLICATION-AUDIT")' /tmp/route.json >/dev/null; then
            echo 'REVIEW_RETURN_LEAK_STILL_FRESH'
            cat /tmp/route.json
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/control-terminal-scope-live-final.yml
          git add .github/workflows/control-terminal-scope-live-final.yml
          git commit -m 'control: remove final HANDOFF live acceptance probe'
          git push origin HEAD:control/terminal-scope-review-barrier-20260907
