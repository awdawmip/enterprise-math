name: tmp-modernize-stale-quality-tests

on:
  push:
    branches:
      - control/perfect-prime-publication-quarantine-resolution-20260831

permissions:
  contents: write

jobs:
  modernize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Replay frozen exact stale-test migration
        run: |
          python - <<'PYBOOT'
          import subprocess
          import textwrap

          frozen = subprocess.check_output(
              [
                  'git',
                  'show',
                  '4a8cce8732b4c3bdea92a3ab92c9a51a3052ecf4:.github/workflows/tmp-modernize-stale-quality-tests.yml',
              ],
              text=True,
          )
          start = "      - name: Apply exact stale-test migrations\n        run: |\n          python - <<'PY'\n"
          end = "\n          PY\n      - name: Run migrated test files only\n"
          if frozen.count(start) != 1 or frozen.count(end) != 1:
              raise SystemExit('frozen migration anchors are not unique')
          body = frozen.split(start, 1)[1].split(end, 1)[0]
          code = textwrap.dedent(body)
          compile(code, '<frozen-stale-test-migration>', 'exec')
          exec(code, {'__name__': '__main__'})
          PYBOOT
      - name: Run migrated test files through repository loader
        env:
          PYTHONPATH: src
        run: |
          python - <<'PYTEST'
          import unittest
          from pathlib import Path
          from control_plane import research_control_bootstrap
          from scripts import run_unittest_shard as shard

          root = Path.cwd()
          research_control_bootstrap.install(root)
          names = [
              'test_free_phase_a_integrity_shell_routing.py',
              'test_free_primitive_substrate_partition.py',
              'test_task_integrity_fault_isolation.py',
              'test_free_researcher_axiom_discovery_contract.py',
              'test_registered_json_migration_applier_unittest.py',
              'test_research_task_registry_cli_surface_unittest.py',
              'test_task_record_audit_fault_isolation_unittest.py',
              'test_current_foundation_authority_contract.py',
              'test_research_result_control_replacements.py',
              'test_research_result_record_compatibility.py',
              'test_driver_control_fault_isolation.py',
              'test_research_review_evidence_contract.py',
              'test_role_control_authority_unittest.py',
              'test_research_architecture_v2_contract.py',
              'test_publication_fault_isolation.py',
          ]
          suite = unittest.TestSuite()
          loader = unittest.TestLoader()
          for name in names:
              path = root / 'tests' / name
              discovered = shard.load_file_suite(path, loader)
              count = discovered.countTestCases()
              if count == 0:
                  raise SystemExit(f'{name}: repository loader produced zero tests')
              print(f'TARGET_DISCOVERY {name} cases={count}', flush=True)
              suite.addTests(discovered)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PYTEST
      - name: Prove only tests changed and commit
        run: |
          changed=$(git diff --name-only)
          if echo "$changed" | grep -v '^tests/' | grep -q .; then
            echo "non-test file changed"
            echo "$changed"
            exit 1
          fi
          test -n "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/
          git commit -m 'test: align quality fixtures with canonical control views'
          git push origin HEAD:control/perfect-prime-publication-quarantine-resolution-20260831
