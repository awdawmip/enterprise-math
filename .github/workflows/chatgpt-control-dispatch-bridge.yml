name: chatgpt-control-dispatch-bridge

on:
  pull_request:
    paths:
      - '.github/workflows/chatgpt-control-dispatch-bridge.yml'
      - 'control_plane/chatgpt_dispatch_request.json'
      - 'docs/CHATGPT_CONTROL_DISPATCH_BRIDGE.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-control-dispatch-bridge.yml'
      - 'control_plane/chatgpt_dispatch_request.json'

permissions:
  contents: write
  issues: read

# Every request-producing commit must get its own run. A fixed concurrency group
# drops pending GitHub Actions runs when a newer request arrives.
concurrency:
  group: chatgpt-control-dispatch-bridge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  canonical-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_PATH: control_plane/chatgpt_dispatch_request.json
      RECEIPT_PATH: control_plane/chatgpt_dispatch_receipt.json
      RECEIPT_DIR: control_plane/chatgpt_dispatch_receipts
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate connector request
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REQUEST_PATH"
          test "$(jq -r '.schema // empty' "$REQUEST_PATH")" = "ENTERPRISE_MATH_CHATGPT_CONTROL_DISPATCH_REQUEST_V1"
          request_id="$(jq -r '.request_id // empty' "$REQUEST_PATH")"
          test -n "$request_id"
          if [[ ! "$request_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "INVALID_REQUEST_ID=$request_id"
            exit 1
          fi
          kind="$(jq -r '.kind // "RESEARCH"' "$REQUEST_PATH")"
          case "$kind" in
            RESEARCH|GOVERNANCE|ANY) ;;
            *) echo "INVALID_DISPATCH_KIND=$kind"; exit 1 ;;
          esac
          if jq -e 'has("session_observations")' "$REQUEST_PATH" >/dev/null; then
            test "$(jq -r '.session_observations.schema // empty' "$REQUEST_PATH")" = "ENTERPRISE_MATH_SESSION_LIVENESS_OBSERVATIONS_V2"
            jq -e '.session_observations.observations | type == "array"' "$REQUEST_PATH" >/dev/null
          fi
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "DISPATCH_KIND=$kind" >> "$GITHUB_ENV"
          echo "IMMUTABLE_RECEIPT_PATH=$RECEIPT_DIR/$request_id.json" >> "$GITHUB_ENV"

      - name: Detect request-producing push
        id: request_change
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse "${GITHUB_SHA}^1")"
          if git diff --quiet "$parent" "$GITHUB_SHA" -- "$REQUEST_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "REQUEST_REPLAY_VALIDATION_ONLY source_sha=$GITHUB_SHA"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "REQUEST_PRODUCING_PUSH source_sha=$GITHUB_SHA"
          fi

      - name: Fetch authoritative Issue 240 comment stream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/em-dispatch
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/issues/240/comments?per_page=100" \
            --jq '.[]' \
            | jq -s '.' > /tmp/em-dispatch/issue-240-comments.json
          jq -e 'type == "array"' /tmp/em-dispatch/issue-240-comments.json >/dev/null
          comment_count="$(jq 'length' /tmp/em-dispatch/issue-240-comments.json)"
          last_comment_id="$(jq '[.[].id] | max // 0' /tmp/em-dispatch/issue-240-comments.json)"
          snapshot_sha256="$(sha256sum /tmp/em-dispatch/issue-240-comments.json | awk '{print $1}')"
          echo "ISSUE240_COMMENT_COUNT=$comment_count" >> "$GITHUB_ENV"
          echo "ISSUE240_LAST_COMMENT_ID=$last_comment_id" >> "$GITHUB_ENV"
          echo "ISSUE240_SNAPSHOT_SHA256=$snapshot_sha256" >> "$GITHUB_ENV"

      - name: Execute canonical recover-before-fresh router
        id: route
        shell: bash
        run: |
          set -euo pipefail
          session_observations="$(jq -c '.session_observations // empty' "$REQUEST_PATH")"
          set +e
          if [[ -n "$session_observations" ]]; then
            python research_control_dispatch.py \
              --events /tmp/em-dispatch/issue-240-comments.json \
              --kind "$DISPATCH_KIND" \
              --session-observations-json "$session_observations" \
              > /tmp/em-dispatch/route.json
          else
            python research_control_dispatch.py \
              --events /tmp/em-dispatch/issue-240-comments.json \
              --kind "$DISPATCH_KIND" \
              > /tmp/em-dispatch/route.json
          fi
          rc=$?
          set -e
          if [[ "$rc" != "0" && "$rc" != "2" ]]; then
            cat /tmp/em-dispatch/route.json
            exit "$rc"
          fi
          jq -e 'type == "object" and (.action | type == "string")' /tmp/em-dispatch/route.json >/dev/null
          echo "router_exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_ROUTE=$(jq -c '.' /tmp/em-dispatch/route.json)"

      - name: Build deterministic bridge receipt
        shell: bash
        env:
          ROUTER_EXIT_CODE: ${{ steps.route.outputs.router_exit_code }}
        run: |
          set -euo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg generated_at "$generated_at" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg kind "$DISPATCH_KIND" \
            --arg immutable_receipt_path "$IMMUTABLE_RECEIPT_PATH" \
            --arg snapshot_sha256 "sha256:$ISSUE240_SNAPSHOT_SHA256" \
            --argjson comment_count "$ISSUE240_COMMENT_COUNT" \
            --argjson last_comment_id "$ISSUE240_LAST_COMMENT_ID" \
            --argjson router_exit_code "$ROUTER_EXIT_CODE" \
            --slurpfile route /tmp/em-dispatch/route.json \
            '{
              schema: "ENTERPRISE_MATH_CHATGPT_CONTROL_DISPATCH_RECEIPT_V1",
              request_id: $request_id,
              generated_at: $generated_at,
              repository: $repository,
              source_sha: $source_sha,
              kind: $kind,
              immutable_receipt_path: $immutable_receipt_path,
              issue_240: {
                comment_count: $comment_count,
                last_comment_id: $last_comment_id,
                raw_comment_snapshot_sha256: $snapshot_sha256
              },
              router_exit_code: $router_exit_code,
              route: $route[0]
            }' > /tmp/em-dispatch/receipt.json
          cat /tmp/em-dispatch/receipt.json

      - name: Persist request receipt on main
        if: github.event_name == 'push' && steps.request_change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if [[ -e "$IMMUTABLE_RECEIPT_PATH" ]]; then
              if jq -e \
                --arg request_id "$REQUEST_ID" \
                --arg source_sha "$GITHUB_SHA" \
                '.request_id == $request_id and .source_sha == $source_sha' \
                "$IMMUTABLE_RECEIPT_PATH" >/dev/null; then
                echo "IMMUTABLE_RECEIPT_ALREADY_PERSISTED path=$IMMUTABLE_RECEIPT_PATH"
                exit 0
              fi
              echo "DUPLICATE_REQUEST_ID_WITH_DIFFERENT_SOURCE path=$IMMUTABLE_RECEIPT_PATH"
              exit 1
            fi

            mkdir -p "$RECEIPT_DIR"
            cp /tmp/em-dispatch/receipt.json "$IMMUTABLE_RECEIPT_PATH"

            current_request_id="$(jq -r '.request_id // empty' "$REQUEST_PATH")"
            if [[ "$current_request_id" == "$REQUEST_ID" ]]; then
              cp /tmp/em-dispatch/receipt.json "$RECEIPT_PATH"
              echo "LATEST_RECEIPT_ELIGIBLE request_id=$REQUEST_ID"
            else
              echo "LATEST_RECEIPT_SKIPPED stale_request=$REQUEST_ID current_request=$current_request_id"
            fi

            git add "$IMMUTABLE_RECEIPT_PATH"
            if [[ "$current_request_id" == "$REQUEST_ID" ]]; then
              git add "$RECEIPT_PATH"
            fi
            git commit -m "control: record ChatGPT canonical dispatch receipt $REQUEST_ID"
            if git push origin HEAD:main; then
              echo "RECEIPT_PERSISTED attempt=$attempt immutable=$IMMUTABLE_RECEIPT_PATH"
              exit 0
            fi
          done

          echo "RECEIPT_PERSIST_FAILED request_id=$REQUEST_ID"
          exit 1
