name: chatgpt-control-dispatch-bridge

on:
  workflow_dispatch:
    inputs:
      original_request_commit:
        description: 'Recover the current receiptless request by its last main file-change commit'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/chatgpt-control-dispatch-bridge.yml'
      - 'control_plane/chatgpt_dispatch_request.json'
      - 'control_plane/researcher_startup_packet.py'
      - 'research_context_budget.json'
      - 'research_driver_authority_compatibility.json'
      - 'docs/CHATGPT_CONTROL_DISPATCH_BRIDGE.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-control-dispatch-bridge.yml'
      - 'control_plane/chatgpt_dispatch_request.json'
      - 'control_plane/researcher_startup_packet.py'
      - 'research_context_budget.json'
      - 'research_driver_authority_compatibility.json'

permissions:
  contents: read

# Every request-producing commit must get its own run. A fixed concurrency group
# drops pending GitHub Actions runs when a newer request arrives.
concurrency:
  group: chatgpt-control-dispatch-bridge-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  REQUEST_PATH: control_plane/chatgpt_dispatch_request.json
  RECEIPT_PATH: control_plane/chatgpt_dispatch_receipt.json
  RECEIPT_DIR: control_plane/chatgpt_dispatch_receipts
  STARTUP_PACKET_DIR: control_plane/chatgpt_startup_packets

jobs:
  inspect-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.request_change.outputs.execute }}
      request_source_commit: ${{ steps.request_change.outputs.request_source_commit }}
      request_id: ${{ steps.envelope.outputs.request_id }}
      kind: ${{ steps.envelope.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate connector request
        id: envelope
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REQUEST_PATH"
          test "$(jq -r '.schema // empty' "$REQUEST_PATH")" = "ENTERPRISE_MATH_CHATGPT_CONTROL_DISPATCH_REQUEST_V1"
          request_id="$(jq -r '.request_id // empty' "$REQUEST_PATH")"
          test -n "$request_id"
          if [[ ! "$request_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "INVALID_REQUEST_ID=$request_id"
            exit 1
          fi
          kind="$(jq -r '.kind // "RESEARCH"' "$REQUEST_PATH")"
          case "$kind" in
            RESEARCH|GOVERNANCE|ANY) ;;
            *) echo "INVALID_DISPATCH_KIND=$kind"; exit 1 ;;
          esac
          if jq -e 'has("priority")' "$REQUEST_PATH" >/dev/null; then
            jq -e '.priority | type == "string"' "$REQUEST_PATH" >/dev/null
            priority="$(jq -r '.priority' "$REQUEST_PATH")"
            case "$priority" in
              P0|P1|P2|P3) ;;
              *) echo "INVALID_DISPATCH_PRIORITY=$priority"; exit 1 ;;
            esac
            jq -e '(has("assigned_driver_task") or has("assigned_research_task")) | not' "$REQUEST_PATH" >/dev/null
          fi
          if jq -e 'has("session_observations")' "$REQUEST_PATH" >/dev/null; then
            test "$(jq -r '.session_observations.schema // empty' "$REQUEST_PATH")" = "ENTERPRISE_MATH_SESSION_LIVENESS_OBSERVATIONS_V2"
            jq -e '.session_observations.observations | type == "array"' "$REQUEST_PATH" >/dev/null
          fi
          if jq -e 'has("assigned_driver_task")' "$REQUEST_PATH" >/dev/null; then
            test "$kind" = "GOVERNANCE"
            jq -e '.assigned_driver_task | type == "object"' "$REQUEST_PATH" >/dev/null
          fi
          if jq -e 'has("assigned_research_task")' "$REQUEST_PATH" >/dev/null; then
            test "$kind" = "RESEARCH"
            jq -e '.assigned_research_task | type == "object"' "$REQUEST_PATH" >/dev/null
            jq -e 'has("assigned_driver_task") | not' "$REQUEST_PATH" >/dev/null
          fi
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "IMMUTABLE_RECEIPT_PATH=$RECEIPT_DIR/$request_id.json" >> "$GITHUB_ENV"
          echo "IMMUTABLE_STARTUP_PACKET_PATH=$STARTUP_PACKET_DIR/$request_id.json" >> "$GITHUB_ENV"

      - name: Detect request authority
        id: request_change
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          ORIGINAL_REQUEST_COMMIT: ${{ inputs.original_request_commit }}
        shell: bash
        run: |
          set -euo pipefail
          execute=false
          case "$GITHUB_EVENT_NAME" in
            push)
              before="$PUSH_BEFORE"
              if [[ ! "$before" =~ ^[0-9a-f]{40}$ || "$before" == "0000000000000000000000000000000000000000" ]]; then
                before="$(git rev-parse "${GITHUB_SHA}^1")"
              fi
              if git diff --quiet "$before" "$GITHUB_SHA" -- "$REQUEST_PATH"; then
                echo "REQUEST_REPLAY_VALIDATION_ONLY"
              else
                rc=$?
                [[ "$rc" == 1 ]] || exit "$rc"
                execute=true
              fi
              ;;
            workflow_dispatch)
              [[ "$GITHUB_REF" == refs/heads/main && "$ORIGINAL_REQUEST_COMMIT" =~ ^[0-9a-f]{40}$ ]]
              [[ "$ORIGINAL_REQUEST_COMMIT" == "$(git log -1 --first-parent --format=%H "$GITHUB_SHA" -- "$REQUEST_PATH")" ]]
              if [[ -e "$IMMUTABLE_RECEIPT_PATH" && -e "$IMMUTABLE_STARTUP_PACKET_PATH" ]]; then
                echo "READ_EXISTING_RECEIPT_AND_PACKET"
              elif [[ -e "$IMMUTABLE_RECEIPT_PATH" || -e "$IMMUTABLE_STARTUP_PACKET_PATH" ]]; then
                echo "INCOMPLETE_IMMUTABLE_PAIR"
                exit 1
              else
                execute=true
              fi
              ;;
            pull_request) echo "REQUEST_REPLAY_VALIDATION_ONLY" ;;
            *) exit 1 ;;
          esac
          if [[ "$execute" == true ]]; then
            request_source_commit="$(git log -1 --first-parent --format=%H "$GITHUB_SHA" -- "$REQUEST_PATH")"
            [[ "$request_source_commit" =~ ^[0-9a-f]{40}$ ]]
            echo "request_source_commit=$request_source_commit" >> "$GITHUB_OUTPUT"
          fi
          echo "execute=$execute" >> "$GITHUB_OUTPUT"

      - name: Check routing and packet fixtures
        run: |
          python -m unittest discover -s tests -p 'test_chatgpt_dispatch_bridge_replay_guard.py'
          python -m unittest discover -s tests -p 'test_researcher_startup_packet*.py'

  canonical-dispatch:
    needs: inspect-request
    if: needs.inspect-request.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_ID: ${{ needs.inspect-request.outputs.request_id }}
      DISPATCH_KIND: ${{ needs.inspect-request.outputs.kind }}
      REQUEST_SOURCE_COMMIT: ${{ needs.inspect-request.outputs.request_source_commit }}
      IMMUTABLE_RECEIPT_PATH: control_plane/chatgpt_dispatch_receipts/${{ needs.inspect-request.outputs.request_id }}.json
      IMMUTABLE_STARTUP_PACKET_PATH: control_plane/chatgpt_startup_packets/${{ needs.inspect-request.outputs.request_id }}.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch authoritative Issue 240 comment stream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/em-dispatch
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/issues/240/comments?per_page=100" \
            --jq '.[]' \
            | jq -s '.' > /tmp/em-dispatch/issue-240-comments.json
          jq -e 'type == "array"' /tmp/em-dispatch/issue-240-comments.json >/dev/null
          comment_count="$(jq 'length' /tmp/em-dispatch/issue-240-comments.json)"
          last_comment_id="$(jq '[.[].id] | max // 0' /tmp/em-dispatch/issue-240-comments.json)"
          snapshot_sha256="$(sha256sum /tmp/em-dispatch/issue-240-comments.json | awk '{print $1}')"
          echo "ISSUE240_COMMENT_COUNT=$comment_count" >> "$GITHUB_ENV"
          echo "ISSUE240_LAST_COMMENT_ID=$last_comment_id" >> "$GITHUB_ENV"
          echo "ISSUE240_SNAPSHOT_SHA256=$snapshot_sha256" >> "$GITHUB_ENV"

      - name: Execute canonical recover-before-fresh router
        id: route
        shell: bash
        run: |
          set -euo pipefail
          session_observations="$(jq -c '.session_observations // empty' "$REQUEST_PATH")"
          priority_args=()
          if jq -e 'has("priority")' "$REQUEST_PATH" >/dev/null; then
            priority_args=(--priority "$(jq -r '.priority' "$REQUEST_PATH")")
          fi
          assigned_args=()
          if jq -e 'has("assigned_driver_task")' "$REQUEST_PATH" >/dev/null; then
            assigned_args=(--assigned-driver-task-json "$(jq -c '.assigned_driver_task' "$REQUEST_PATH")")
          fi
          if jq -e 'has("assigned_research_task")' "$REQUEST_PATH" >/dev/null; then
            assigned_args=(--assigned-research-task-json "$(jq -c '.assigned_research_task' "$REQUEST_PATH")")
          fi
          set +e
          if [[ -n "$session_observations" ]]; then
            python research_control_dispatch.py \
              --events /tmp/em-dispatch/issue-240-comments.json \
              --kind "$DISPATCH_KIND" \
              "${priority_args[@]}" \
              "${assigned_args[@]}" \
              --session-observations-json "$session_observations" \
              > /tmp/em-dispatch/route.json
          else
            python research_control_dispatch.py \
              --events /tmp/em-dispatch/issue-240-comments.json \
              --kind "$DISPATCH_KIND" \
              "${priority_args[@]}" \
              "${assigned_args[@]}" \
              > /tmp/em-dispatch/route.json
          fi
          rc=$?
          set -e
          if [[ "$rc" != "0" && "$rc" != "2" ]]; then
            cat /tmp/em-dispatch/route.json
            exit "$rc"
          fi
          jq -e 'type == "object" and (.action | type == "string")' /tmp/em-dispatch/route.json >/dev/null
          echo "router_exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "CANONICAL_ROUTE=$(jq -c '.' /tmp/em-dispatch/route.json)"

      - name: Build deterministic bridge receipt
        shell: bash
        env:
          ROUTER_EXIT_CODE: ${{ steps.route.outputs.router_exit_code }}
        run: |
          set -euo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg generated_at "$generated_at" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg request_source_commit "$REQUEST_SOURCE_COMMIT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg kind "$DISPATCH_KIND" \
            --arg immutable_receipt_path "$IMMUTABLE_RECEIPT_PATH" \
            --arg snapshot_sha256 "sha256:$ISSUE240_SNAPSHOT_SHA256" \
            --argjson comment_count "$ISSUE240_COMMENT_COUNT" \
            --argjson last_comment_id "$ISSUE240_LAST_COMMENT_ID" \
            --argjson router_exit_code "$ROUTER_EXIT_CODE" \
            --slurpfile route /tmp/em-dispatch/route.json \
            '{
              schema: "ENTERPRISE_MATH_CHATGPT_CONTROL_DISPATCH_RECEIPT_V1",
              request_id: $request_id,
              generated_at: $generated_at,
              repository: $repository,
              source_sha: $source_sha,
              request_source_commit: $request_source_commit,
              explicit_receipt_recovery: ($event == "workflow_dispatch"),
              kind: $kind,
              immutable_receipt_path: $immutable_receipt_path,
              issue_240: {
                comment_count: $comment_count,
                last_comment_id: $last_comment_id,
                raw_comment_snapshot_sha256: $snapshot_sha256
              },
              router_exit_code: $router_exit_code,
              route: $route[0]
            }' > /tmp/em-dispatch/receipt.json
          cat /tmp/em-dispatch/receipt.json

      - name: Build compact researcher startup packet
        shell: bash
        run: |
          set -euo pipefail
          python control_plane/researcher_startup_packet.py \
            --receipt /tmp/em-dispatch/receipt.json \
            --output /tmp/em-dispatch/startup-packet.json
          jq -e \
            --arg request_id "$REQUEST_ID" \
            --arg source_sha "$GITHUB_SHA" \
            '.schema == "ENTERPRISE_MATH_RESEARCHER_STARTUP_PACKET_V1" and .request_id == $request_id and .source_sha == $source_sha and (.packet_bytes <= 8192)' \
            /tmp/em-dispatch/startup-packet.json >/dev/null
          cat /tmp/em-dispatch/startup-packet.json

      - name: Persist request receipt on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if [[ -e "$IMMUTABLE_RECEIPT_PATH" ]]; then
              if saved_source="$(jq -er \
                --arg request_id "$REQUEST_ID" \
                --arg request_source "$REQUEST_SOURCE_COMMIT" \
                --arg execution_source "$GITHUB_SHA" \
                'select(.request_id == $request_id and
                  (.request_source_commit == $request_source or
                   (.request_source_commit == null and .source_sha == $execution_source)))
                 | .source_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
                "$IMMUTABLE_RECEIPT_PATH")"; then
                if [[ -e "$IMMUTABLE_STARTUP_PACKET_PATH" ]] && jq -e \
                  --arg request_id "$REQUEST_ID" \
                  --arg source_sha "$saved_source" \
                  '.request_id == $request_id and .source_sha == $source_sha' \
                  "$IMMUTABLE_STARTUP_PACKET_PATH" >/dev/null; then
                  echo "IMMUTABLE_RECEIPT_AND_STARTUP_PACKET_ALREADY_PERSISTED receipt=$IMMUTABLE_RECEIPT_PATH packet=$IMMUTABLE_STARTUP_PACKET_PATH"
                  exit 0
                fi
                echo "IMMUTABLE_STARTUP_PACKET_MISSING_OR_MISMATCHED_FOR_EXISTING_RECEIPT path=$IMMUTABLE_STARTUP_PACKET_PATH"
                exit 1
              fi
              echo "DUPLICATE_REQUEST_ID_WITH_DIFFERENT_SOURCE path=$IMMUTABLE_RECEIPT_PATH"
              exit 1
            fi

            if [[ -e "$IMMUTABLE_STARTUP_PACKET_PATH" ]]; then
              echo "ORPHAN_IMMUTABLE_STARTUP_PACKET path=$IMMUTABLE_STARTUP_PACKET_PATH"
              exit 1
            fi

            mkdir -p "$RECEIPT_DIR" "$STARTUP_PACKET_DIR"
            cp /tmp/em-dispatch/receipt.json "$IMMUTABLE_RECEIPT_PATH"
            cp /tmp/em-dispatch/startup-packet.json "$IMMUTABLE_STARTUP_PACKET_PATH"

            current_request_id="$(jq -r '.request_id // empty' "$REQUEST_PATH")"
            current_request_commit="$(git log -1 --first-parent --format=%H HEAD -- "$REQUEST_PATH")"
            git add "$IMMUTABLE_RECEIPT_PATH" "$IMMUTABLE_STARTUP_PACKET_PATH"
            if [[ "$current_request_id" == "$REQUEST_ID" && "$current_request_commit" == "$REQUEST_SOURCE_COMMIT" ]]; then
              cp /tmp/em-dispatch/receipt.json "$RECEIPT_PATH"
              git add "$RECEIPT_PATH"
              echo "LATEST_RECEIPT_ELIGIBLE request_id=$REQUEST_ID"
            else
              echo "LATEST_RECEIPT_SKIPPED stale_request=$REQUEST_ID current_request=$current_request_id"
            fi

            git commit -m "control: record ChatGPT dispatch receipt and startup packet $REQUEST_ID"
            if git push origin HEAD:main; then
              echo "RECEIPT_AND_STARTUP_PACKET_PERSISTED attempt=$attempt receipt=$IMMUTABLE_RECEIPT_PATH packet=$IMMUTABLE_STARTUP_PACKET_PATH"
              exit 0
            fi
          done

          echo "RECEIPT_PERSIST_FAILED request_id=$REQUEST_ID"
          exit 1
