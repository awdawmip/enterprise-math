name: euler-fcc-chiral-transport

on:
  pull_request:
    paths:
      - "EnterpriseMath/EulerRotation/FccChiralTransportObstruction.lean"
      - "src/enterprise_math/euler_fcc_chiral_transport.py"
      - "tests/test_euler_fcc_chiral_transport.py"
      - "research_notes/EULER_FCC_CHIRAL_TRANSPORT_OBSTRUCTION_20260904.md"
      - "research_notes/EULER_FCC_CHIRAL_TRANSPORT_THEOREM_LEDGER_20260904.json"
      - ".github/workflows/euler-fcc-chiral-transport.yml"
  workflow_dispatch:

jobs:
  exact-and-formal-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile exact checker and tests
        run: >-
          python -m py_compile
          src/enterprise_math/euler_fcc_chiral_transport.py
          tests/test_euler_fcc_chiral_transport.py
      - name: Exhaust all 64 FCC chirality connections
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests/test_euler_fcc_chiral_transport.py
      - name: Reject proof placeholders
        run: |
          if grep -R -n -E '\b(sorry|admit|axiom)\b' EnterpriseMath/EulerRotation/FccChiralTransportObstruction.lean; then
            echo "Proof placeholder detected"
            exit 1
          fi
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Build FCC chirality obstruction module
        run: >-
          lake build --wfail -KCI
          EnterpriseMath.EulerRotation.FccChiralTransportObstruction
