name: apply-legacy-control-isolation

on:
  push:
    branches:
      - control/legacy-control-plane-migration-20260902
    paths:
      - '.github/workflows/apply-legacy-control-isolation.yml'
      - 'control_plane/apply_legacy_control_isolation.py'
      - 'control_plane/run_apply_legacy_control_isolation.py'
      - 'control_plane/run_apply_legacy_control_isolation_v2.py'

permissions:
  contents: write

concurrency:
  group: apply-legacy-control-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Preserve compatibility anchors without restoring legacy authority
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one compatibility span, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "control_plane/apply_legacy_control_isolation.py",
              "`OFFICIAL_NEW_TASK -> IMMUTABLE_V2_TASK_PUBLICATION_RECORD`.\n\n`UNPUBLISHED_TASK -> NO READY / NO CLAIM / NO EXECUTION`.",
              "`OFFICIAL_NEW_TASK -> IMMUTABLE_V2_TASK_PUBLICATION_RECORD`.\n\nCompatibility vocabulary only: `OFFICIAL_NEW_TASK -> CANONICAL_TASK_REGISTRY_RECORD`; in V2, that registry record is the immutable publication record above.\n\n`UNPUBLISHED_TASK -> NO READY / NO CLAIM / NO EXECUTION`.",
          )
          replace_once(
              "control_plane/apply_legacy_control_isolation.py",
              "- `tools/research_lane_dispatch.py` — active-cohort lane selector;\n- `tools/research_runtime_reducer.py` — pure authenticated-event reducer;",
              "- `tools/research_lane_dispatch.py` — active-cohort lane selector;\n- `tools/research_lane_claims.py` — exact lane-claim ownership and conflict surface;\n- `tools/research_cohort_runtime.py` — exact cohort/lane runtime ownership surface;\n- `tools/research_runtime.py` — parent/session/final state machine;\n- `tools/research_runtime_reducer.py` — pure authenticated-event reducer;",
          )
          replace_once(
              "control_plane/apply_legacy_control_isolation.py",
              "        if item.get(\"registration_source\") not in {\n            \"IMMUTABLE_TASK_RECORD\",\n            \"TASK_DEFINITION_FAULT_QUARANTINE\",\n        }:",
              "        if item.get(\"registration_source\") not in {\n            \"IMMUTABLE_TASK_RECORD\",\n            \"TASK_DEFINITION_FAULT_QUARANTINE\",\n            \"TASK_INTEGRITY_QUARANTINE\",\n            \"PUBLICATION_FORK_QUARANTINE\",\n        }:",
          )
          replace_once(
              "control_plane/run_apply_legacy_control_isolation_v2.py",
              "publish the task before READY/CLAIM/execution",
              "register the task by publishing its immutable V2 record before READY/CLAIM/execution",
          )
          PY
      - name: Apply physical isolation and V2 runtime rewiring
        run: python control_plane/run_apply_legacy_control_isolation_v2.py
      - name: Remove final V1-only authority assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("control_plane/check_current_control_authority.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "* V1 task-registry write commands remain fail-closed compatibility only.\n",
              "* physical absence of the pre-V2 task and scheduler authority surfaces.\n",
          )
          old = (
              "    require(\n"
              "        task_auth.get(\"legacy_role\") == \"READ_ONLY_COMPATIBILITY_AND_AUDIT_ONLY\",\n"
              "        \"V1 registry must be read-only compatibility\",\n"
              "    )\n\n"
          )
          if text.count(old) != 1:
              raise SystemExit("current-authority checker: expected one V1 legacy_role assertion")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY
      - name: Migrate remaining prompt assertions to V2
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_research_runtime_unittest.py")
          text = path.read_text(encoding="utf-8")
          old = '            "OFFICIAL_NEW_TASK -> CANONICAL_TASK_REGISTRY_RECORD",\n            "RESEARCHER_MAY_PUBLISH_TASK_WITHOUT_DRIVER_APPROVAL",'
          new = '            "OFFICIAL_NEW_TASK -> IMMUTABLE_V2_TASK_PUBLICATION_RECORD",\n            "UNPUBLISHED_TASK -> NO READY / NO CLAIM / NO EXECUTION",'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"runtime test: expected one prompt-assertion span, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Compile live control code
        run: |
          python -m py_compile \
            tools/research_runtime_reducer.py \
            tools/research_dispatch.py \
            tools/research_runtime.py \
            tools/research_runtime_guard.py \
            control_plane/research_runtime_guard_core.py \
            control_plane/research_publication_fault_isolation.py \
            control_plane/check_legacy_control_isolation.py
      - name: Check physical isolation and current-only prompt boundary
        run: python control_plane/check_legacy_control_isolation.py
      - name: Test V2 runtime reducer
        run: python -m unittest discover -s tests -p 'test_research_runtime_reducer.py'
      - name: Test execution identity binding
        run: python -m unittest discover -s tests -p 'test_research_identity.py'
      - name: Test runtime state contract
        run: python -m unittest discover -s tests -p 'test_research_runtime_unittest.py'
      - name: Test role and control authority
        run: python -m unittest discover -s tests -p 'test_role_control_authority_unittest.py'
      - name: Validate current authority
        run: python control_plane/check_current_control_authority.py
      - name: Validate root JSON with filenames
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          paths = sorted(Path('.').glob('*.json'))
          for path in paths:
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(path.as_posix())
                  print(f'ERROR: {path}: {exc}')
          if failures:
              raise SystemExit(f'root JSON invalid: {failures}')
          print(f'root JSON: PASS ({len(paths)} files)')
          PY
      - name: Validate installed V2 dispatch
        run: |
          python -c "from control_plane import research_control_bootstrap as b; b.install(); from tools import research_dispatch as d; e=d.validate(); print(e); raise SystemExit(bool(e))"
      - name: Remove one-shot cutover machinery
        run: |
          rm -f control_plane/apply_legacy_control_isolation.py
          rm -f control_plane/run_apply_legacy_control_isolation.py
          rm -f control_plane/run_apply_legacy_control_isolation_v2.py
          rm -f .github/workflows/apply-legacy-control-isolation.yml
      - name: Commit physical-isolation transaction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Physical isolation already materialized.'
            exit 0
          fi
          git commit -m 'control: isolate pre-V2 state machine and activate V2 runtime'
          git push origin HEAD:${{ github.ref_name }}
