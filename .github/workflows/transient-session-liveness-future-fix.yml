name: transient-session-liveness-future-fix

on:
  push:
    branches:
      - control/session-liveness-future-evidence-20260907
    paths:
      - '.github/workflows/transient-session-liveness-future-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: control/session-liveness-future-evidence-20260907
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply fail-closed future-time guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('tools/research_runtime.py')
          text = runtime.read_text()
          old = '''    stale_at = parse_time(last_activity) + timedelta(minutes=session_liveness_minutes)\n'''
          new = '''    last_activity_at = parse_time(last_activity)\n    if last_activity_at > now:\n        raise RuntimeStateError("session.last_activity_at cannot be in the future")\n    stale_at = last_activity_at + timedelta(minutes=session_liveness_minutes)\n'''
          if old not in text:
              raise SystemExit('runtime patch anchor missing')
          runtime.write_text(text.replace(old, new, 1))

          test = Path('tests/test_control_dispatch_session_observation_time.py')
          text = test.read_text()
          text = text.replace(
              'with self.assertRaisesRegex(rcd.ControlDispatchError, "future"):',
              'with self.assertRaisesRegex(research_runtime.RuntimeStateError, "future"):',
              1,
          )
          marker = '''    def test_activity_exactly_now_remains_valid(self):\n'''
          direct = '''    def test_runtime_dispatch_itself_rejects_future_activity(self):\n        with self.assertRaisesRegex(research_runtime.RuntimeStateError, "future"):\n            research_runtime.dispatch_decision(\n                leased_target()["state"],\n                session_last_activity_at="2099-01-01T00:00:00+00:00",\n                now=NOW,\n            )\n\n'''
          if marker not in text:
              raise SystemExit('test insertion anchor missing')
          test.write_text(text.replace(marker, direct + marker, 1))
          PY
          python -m unittest -v tests.test_control_dispatch_session_observation_time
          python -m unittest -v tests.test_control_plane_adversarial_simulation
          python -m unittest -v tests.test_chatgpt_dispatch_bridge_replay_guard
          python -m unittest -v tests.test_result_handoff_dispatch_guard
          python -m unittest -v tests.test_registered_done_dispatch_guard
          python -m unittest -v tests.test_result_reopen_runtime_precedence
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/research_runtime.py tests/test_control_dispatch_session_observation_time.py
          git commit -m 'fix(control): reject future session liveness evidence'
          git push origin HEAD:control/session-liveness-future-evidence-20260907
