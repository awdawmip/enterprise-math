name: brc-feedback-mobius-interaction-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_FEEDBACK_MOBIUS_INTERACTION_HIERARCHY_20260903.md'
      - 'experiments/brc_feedback_mobius_interaction_check.py'
      - '.github/workflows/brc-feedback-mobius-interaction-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC feedback Mobius interaction checker
        run: python experiments/brc_feedback_mobius_interaction_check.py
