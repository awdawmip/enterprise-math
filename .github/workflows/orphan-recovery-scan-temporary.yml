name: orphan-recovery-scan-temporary
on:
  push:
    branches: [control/recover-dangling-research-20260906]
    paths:
      - 'tools/research_orphan_recovery_repackage.py'
      - '.github/workflows/orphan-recovery-scan-temporary.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Fetch remote refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Repackage raw scan into recovery states
        run: |
          python tools/research_orphan_recovery_repackage.py \
            --raw control_plane/research_orphan_recovery_scan_20260906.json \
            --output control_plane/research_orphan_recovery_state_20260906.json
      - name: Persist state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control_plane/research_orphan_recovery_state_20260906.json
          git commit -m 'control: package dangling research into recovery states'
          git push origin HEAD:control/recover-dangling-research-20260906
