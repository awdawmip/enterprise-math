name: control-handoff-scope-contract-patch

on:
  push:
    branches:
      - control/terminal-scope-review-barrier-20260907
    paths:
      - '.github/workflows/control-handoff-scope-contract-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply HANDOFF contract patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Reducer: explicit handoff scopes + exact legacy machine marker.
          path = Path('tools/research_runtime_reducer.py')
          text = path.read_text(encoding='utf-8')
          old = 'DRIVER_REVIEW_TERMINAL_SCOPE = "RESEARCH_RETURN_FROZEN_AWAITING_DRIVER_REVIEW"\n'
          new = '''DRIVER_REVIEW_TERMINAL_SCOPE = "RESEARCH_RETURN_FROZEN_AWAITING_DRIVER_REVIEW"\nHANDOFF_SCOPE_CONTINUATION = "CONTINUATION"\nHANDOFF_SCOPE_FROZEN_RETURN = "FROZEN_RETURN_AWAITING_DRIVER_REVIEW"\nLEGACY_DRIVER_REVIEW_TERMINAL_CANDIDATES = {\n    "SUCCESS_REVIEW_COMPLETE_AWAITING_DRIVER_DECISION",\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('reducer constant anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''            terminal_scope = event.get("terminal_scope")\n            driver_review_terminal = terminal_scope == DRIVER_REVIEW_TERMINAL_SCOPE\n            # A result-bearing HANDOFF or the exact legacy frozen-return terminal\n            # scope is a provisional review barrier even before an immutable result\n            # record lands on main.  Plain HANDOFF remains a researcher-to-researcher\n            # continuation surface.  Unknown terminal_scope values carry no authority.\n            state["state"] = (\n                "FROZEN_RETURN"\n                if result_id is not None or driver_review_terminal\n                else "HANDOFF_READY"\n            )\n            if isinstance(result_id, str):\n                state["result_id"] = result_id.strip()\n            else:\n                state.pop("result_id", None)\n            if driver_review_terminal:\n                state["terminal_scope"] = DRIVER_REVIEW_TERMINAL_SCOPE\n            else:\n                state.pop("terminal_scope", None)\n'''
          new = '''            terminal_scope = event.get("terminal_scope")\n            handoff_scope = event.get("handoff_scope")\n            if handoff_scope is not None and handoff_scope not in {\n                HANDOFF_SCOPE_CONTINUATION,\n                HANDOFF_SCOPE_FROZEN_RETURN,\n            }:\n                ignore(state, index, "HANDOFF handoff_scope is invalid")\n                continue\n            legacy_terminal_candidate = event.get("terminal_candidate")\n            driver_review_terminal = (\n                terminal_scope == DRIVER_REVIEW_TERMINAL_SCOPE\n                or handoff_scope == HANDOFF_SCOPE_FROZEN_RETURN\n                or legacy_terminal_candidate in LEGACY_DRIVER_REVIEW_TERMINAL_CANDIDATES\n            )\n            if handoff_scope == HANDOFF_SCOPE_CONTINUATION and (\n                result_id is not None or driver_review_terminal\n            ):\n                ignore(state, index, "HANDOFF CONTINUATION scope contradicts frozen-return marker")\n                continue\n            # A result-bearing HANDOFF, an explicit frozen-return handoff_scope, or\n            # an exact legacy frozen-return machine marker is a provisional review\n            # barrier even before an immutable result record lands on main.  Explicit\n            # CONTINUATION remains researcher-to-researcher.  Natural-language fields\n            # never decide terminality.\n            state["state"] = (\n                "FROZEN_RETURN"\n                if result_id is not None or driver_review_terminal\n                else "HANDOFF_READY"\n            )\n            if isinstance(result_id, str):\n                state["result_id"] = result_id.strip()\n            else:\n                state.pop("result_id", None)\n            if terminal_scope == DRIVER_REVIEW_TERMINAL_SCOPE:\n                state["terminal_scope"] = DRIVER_REVIEW_TERMINAL_SCOPE\n            else:\n                state.pop("terminal_scope", None)\n            if handoff_scope in {HANDOFF_SCOPE_CONTINUATION, HANDOFF_SCOPE_FROZEN_RETURN}:\n                state["handoff_scope"] = handoff_scope\n            else:\n                state.pop("handoff_scope", None)\n            if legacy_terminal_candidate in LEGACY_DRIVER_REVIEW_TERMINAL_CANDIDATES:\n                state["terminal_candidate"] = legacy_terminal_candidate\n            else:\n                state.pop("terminal_candidate", None)\n'''
          if text.count(old) != 1:
              raise SystemExit('reducer HANDOFF anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Registered adapter: post-cutover unscoped HANDOFF fails closed.
          path = Path('tools/research_dispatch.py')
          text = path.read_text(encoding='utf-8')
          old = 'import copy\nfrom pathlib import Path\nfrom typing import Any\n'
          new = 'import copy\nfrom datetime import datetime, timezone\nfrom pathlib import Path\nfrom typing import Any\n'
          if text.count(old) != 1:
              raise SystemExit('dispatch import anchor mismatch')
          text = text.replace(old, new, 1)

          old = '_ORIGINAL_FILTER_REGISTERED_EVENTS = _core._filter_registered_events\n_AUTO_RESULT_STATE = object()\n'
          new = '''_ORIGINAL_FILTER_REGISTERED_EVENTS = _core._filter_registered_events\n_ORIGINAL_BLOCK_UNREVIEWED_REGISTERED_DONE = _core._block_unreviewed_registered_done\n_AUTO_RESULT_STATE = object()\nHANDOFF_SCOPE_CUTOVER = datetime(2026, 9, 7, 2, 20, tzinfo=timezone.utc)\nHANDOFF_SCOPE_CONTINUATION = "CONTINUATION"\nHANDOFF_SCOPE_FROZEN_RETURN = "FROZEN_RETURN_AWAITING_DRIVER_REVIEW"\nDRIVER_REVIEW_TERMINAL_SCOPE = "RESEARCH_RETURN_FROZEN_AWAITING_DRIVER_REVIEW"\nHANDOFF_SCOPE_REQUIRED_REASON = (\n    "registered HANDOFF requires explicit handoff_scope or frozen-return marker after HANDOFF scope cutover"\n)\n'''
          if text.count(old) != 1:
              raise SystemExit('dispatch constant anchor mismatch')
          text = text.replace(old, new, 1)

          marker = 'def _filter_registered_events(\n'
          if text.count(marker) != 1:
              raise SystemExit('dispatch filter marker mismatch')
          helper = '''def _registered_handoff_scope_reason(event: dict[str, Any]) -> str | None:\n    if event.get("event") != "HANDOFF":\n        return None\n    meta = event.get(_core.GITHUB_META_KEY)\n    created_at = meta.get("created_at") if isinstance(meta, dict) else None\n    try:\n        created = _core.research_runtime_reducer.parse_time(created_at)\n    except Exception:\n        return "registered HANDOFF requires valid authenticated GitHub created_at"\n    if created < HANDOFF_SCOPE_CUTOVER:\n        return None\n    result_id = event.get("result_id")\n    if isinstance(result_id, str) and result_id.strip():\n        return None\n    if event.get("terminal_scope") == DRIVER_REVIEW_TERMINAL_SCOPE:\n        return None\n    if event.get("handoff_scope") in {\n        HANDOFF_SCOPE_CONTINUATION,\n        HANDOFF_SCOPE_FROZEN_RETURN,\n    }:\n        return None\n    return HANDOFF_SCOPE_REQUIRED_REASON\n\n\ndef _enforce_registered_handoff_scopes(\n    events: list[dict[str, Any]],\n    accepted: list[dict[str, Any]],\n    rejected: list[dict[str, Any]],\n) -> tuple[list[dict[str, Any]], list[dict[str, Any]]]:\n    kept: list[dict[str, Any]] = []\n    extra_rejected = list(rejected)\n    for event in accepted:\n        reason = _registered_handoff_scope_reason(event)\n        if reason is None:\n            kept.append(event)\n            continue\n        index = _event_source_index(event, events)\n        extra_rejected.append({\n            "index": index if index is not None else 0,\n            "reason": reason,\n        })\n    return kept, extra_rejected\n\n\n'''
          text = text.replace(marker, helper + marker, 1)

          old = '    return _bind_intent_claim_publications(task, events, accepted, rejected, root)\n\n\ndef _post_review_runtime_transition(\n'
          new = '''    accepted, rejected = _bind_intent_claim_publications(\n        task, events, accepted, rejected, root\n    )\n    return _enforce_registered_handoff_scopes(events, accepted, rejected)\n\n\ndef _post_review_runtime_transition(\n'''
          if text.count(old) != 1:
              raise SystemExit('dispatch filter return anchor mismatch')
          text = text.replace(old, new, 1)

          marker = '# Patch the preserved core because functions such as effective_states() resolve\n'
          if text.count(marker) != 1:
              raise SystemExit('dispatch patch marker mismatch')
          blocker = '''def _block_unscoped_registered_handoff(\n    task: dict[str, Any],\n    state: dict[str, Any],\n    authenticated: list[dict[str, Any]],\n    registered_rejected: list[dict[str, Any]],\n    result_state: dict[str, Any] | None,\n    reduced_task_events: list[dict[str, Any]] | None = None,\n    reducer_ignored_indices: set[int] | None = None,\n) -> dict[str, Any]:\n    if result_state is not None or state.get("dispatch_state") != "NEEDS_DISPATCH":\n        return state\n    ignored = reducer_ignored_indices or set()\n    for rejected in registered_rejected:\n        if rejected.get("reason") != HANDOFF_SCOPE_REQUIRED_REASON:\n            continue\n        index = rejected.get("index")\n        if type(index) is not int or index < 0 or index >= len(authenticated):\n            continue\n        event = authenticated[index]\n        if event.get("task_id") != task.get("task_id") or event.get("event") != "HANDOFF":\n            continue\n        meta = event.get(_core.GITHUB_META_KEY)\n        rejected_comment_id = meta.get("comment_id") if isinstance(meta, dict) else None\n        if type(rejected_comment_id) is int and reduced_task_events is not None:\n            later_applied = False\n            for reduced_index, reduced_event in enumerate(reduced_task_events):\n                if reduced_index in ignored:\n                    continue\n                reduced_meta = reduced_event.get(_core.GITHUB_META_KEY)\n                reduced_comment_id = (\n                    reduced_meta.get("comment_id") if isinstance(reduced_meta, dict) else None\n                )\n                if type(reduced_comment_id) is int and reduced_comment_id > rejected_comment_id:\n                    later_applied = True\n                    break\n            if later_applied:\n                continue\n        value = copy.deepcopy(state)\n        value["state"] = "BLOCKED"\n        value["dispatch_state"] = "BLOCKED"\n        value["hard_block"] = {\n            "code": "REGISTERED_HANDOFF_SCOPE_REQUIRED",\n            "publication_id": task.get("publication_id"),\n            "claim_id": event.get("claim_id"),\n            "server_comment_id": rejected_comment_id,\n        }\n        value["next_action"] = (\n            "Append a structurally scoped HANDOFF correction while the owner lease remains valid, "\n            "or obtain an authorized lifecycle correction; do not redispatch this ambiguous handoff."\n        )\n        return value\n    return state\n\n\ndef _block_unreviewed_registered_done(\n    task: dict[str, Any],\n    state: dict[str, Any],\n    authenticated: list[dict[str, Any]],\n    registered_rejected: list[dict[str, Any]],\n    result_state: dict[str, Any] | None,\n    reduced_task_events: list[dict[str, Any]] | None = None,\n    reducer_ignored_indices: set[int] | None = None,\n) -> dict[str, Any]:\n    value = _ORIGINAL_BLOCK_UNREVIEWED_REGISTERED_DONE(\n        task,\n        state,\n        authenticated,\n        registered_rejected,\n        result_state,\n        reduced_task_events,\n        reducer_ignored_indices,\n    )\n    return _block_unscoped_registered_handoff(\n        task,\n        value,\n        authenticated,\n        registered_rejected,\n        result_state,\n        reduced_task_events,\n        reducer_ignored_indices,\n    )\n\n\n'''
          text = text.replace(marker, blocker + marker, 1)

          old = '_core._filter_registered_events = _filter_registered_events\n_core._overlay_result_state = _overlay_result_state\n'
          new = '''_core._filter_registered_events = _filter_registered_events\n_core._overlay_result_state = _overlay_result_state\n_core._block_unreviewed_registered_done = _block_unreviewed_registered_done\n'''
          if text.count(old) != 1:
              raise SystemExit('dispatch core patch anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Focused CI path coverage.
          path = Path('.github/workflows/control-plane-pr-focused-validation.yml')
          text = path.read_text(encoding='utf-8')
          anchor = "      - 'tools/research_dispatch.py'\n"
          addition = "      - 'tools/research_dispatch.py'\n      - 'tools/research_runtime_reducer.py'\n      - 'tests/test_result_handoff_dispatch_guard.py'\n      - 'tests/test_registered_done_dispatch_guard.py'\n      - 'tests/test_registered_handoff_scope_guard.py'\n"
          if "tests/test_registered_handoff_scope_guard.py" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('focused CI path anchor mismatch')
              text = text.replace(anchor, addition, 1)
          run_anchor = '          python -m unittest -v tests.test_result_handoff_dispatch_guard\n'
          if 'tests.test_registered_handoff_scope_guard' not in text:
              if text.count(run_anchor) != 1:
                  raise SystemExit('focused CI run anchor mismatch')
              text = text.replace(\n                  run_anchor,\n                  run_anchor + '          python -m unittest -v tests.test_registered_handoff_scope_guard\n',\n                  1,\n              )
          path.write_text(text, encoding='utf-8')

          # Scheduling protocol: explicit machine contract.
          path = Path('docs/RESEARCH_SCHEDULING_PROTOCOL.en.md')
          text = path.read_text(encoding='utf-8')
          if 'HANDOFF scope cutover' not in text:
              text += '''\n\n## HANDOFF scope cutover\n\nFor registered Issue #240 HANDOFF events with GitHub server `created_at >= 2026-09-07T02:20:00Z`, handoff intent is machine-explicit. A researcher-to-researcher continuation uses `handoff_scope: CONTINUATION`. A frozen return awaiting Driver review uses `handoff_scope: FROZEN_RETURN_AWAITING_DRIVER_REVIEW`, or carries a nonempty `result_id`; the legacy exact `terminal_scope: RESEARCH_RETURN_FROZEN_AWAITING_DRIVER_REVIEW` remains accepted. Natural-language `next_action`, `summary`, or `progress_ref` never determines terminality.\n\nA post-cutover registered HANDOFF without one of those structural markers is ambiguous and fails closed. It cannot silently become a fresh task after lease expiry. While the original claim lease remains valid, append a new structurally scoped HANDOFF as the correction; do not edit the old Issue #240 event.\n\nFreeze:\n\n`HANDOFF_TEXT != TERMINAL_AUTHORITY`.\n\n`POST_CUTOVER_HANDOFF -> EXPLICIT_MACHINE_SCOPE`.\n\n`AMBIGUOUS_HANDOFF != FRESH_REDISPATCH`.\n'''
          path.write_text(text, encoding='utf-8')
          PY

          cat > tests/test_registered_handoff_scope_guard.py <<'PY'
          import unittest
          from unittest import mock

          from tools import research_dispatch as rd
          from tools import research_runtime_reducer as rr

          PUB = "TP2-SCOPE"
          BASE = "1" * 40

          def task():
              return {
                  "task_id": "RS-SCOPE-GUARD",
                  "title": "scope guard",
                  "kind": "RESEARCH",
                  "owner": "taskbook/unassigned",
                  "base_state": "READY",
                  "priority": "P0",
                  "leverage": "HIGH",
                  "frontier": "scope",
                  "next_action": "continue",
                  "dependencies": [],
                  "source_refs": [],
                  "last_progress_at": "2026-09-07T02:19:00+00:00",
                  "hard_block": None,
                  "claim_lease_minutes": 10,
                  "identity_lane": "SCOPE",
                  "publication_id": PUB,
                  "taskbook_blob_sha1": "2" * 40,
                  "registration_source": "IMMUTABLE_TASK_RECORD",
              }

          def meta(cid, at):
              return {
                  "server_authenticated": True,
                  "issue_number": 240,
                  "comment_id": cid,
                  "author_login": "awdawmip",
                  "author_user_id": 30957095,
                  "author_association": "OWNER",
                  "control_authorized": True,
                  "created_at": at,
                  "updated_at": at,
                  "edited": False,
              }

          def event(kind, cid, at, **extra):
              value = {
                  "schema": rr.EVENT_SCHEMA,
                  "event": kind,
                  "task_id": "RS-SCOPE-GUARD",
                  "at": at,
                  rd.GITHUB_META_KEY: meta(cid, at),
              }
              value.update(extra)
              return value

          def claim(cid=1, at="2026-09-07T02:21:00+00:00"):
              return event(
                  "CLAIM", cid, at,
                  claim_id="c1",
                  publication_id=PUB,
                  theorem_owner="taskbook/unassigned",
                  execution_branch="research/scope-c1",
                  execution_branch_base=BASE,
                  allowed_outputs=["tests/scope.txt"],
                  lease_minutes=10,
              )

          class RegisteredHandoffScopeGuardTests(unittest.TestCase):
              def reduce(self, events, now):
                  with (
                      mock.patch.object(rd.research_result_records, "task_result_state", return_value=None),
                      mock.patch.object(rd.research_execution_records, "intent_for_claim", return_value=None),
                      mock.patch.object(rd.research_cohort_runtime, "task_active_cohort_state", return_value=None),
                  ):
                      return rd.reduce_definition(task(), events, now=rr.parse_time(now))

              def test_post_cutover_unscoped_handoff_blocks_after_lease_expiry(self):
                  events = [
                      claim(),
                      event("HANDOFF", 2, "2026-09-07T02:22:00+00:00", claim_id="c1", next_action="ambiguous"),
                  ]
                  state = self.reduce(events, "2026-09-07T02:40:00+00:00")
                  self.assertEqual("BLOCKED", state["dispatch_state"])
                  self.assertEqual("REGISTERED_HANDOFF_SCOPE_REQUIRED", state["hard_block"]["code"])

              def test_post_cutover_unscoped_handoff_preserves_live_owner_before_expiry(self):
                  events = [
                      claim(),
                      event("HANDOFF", 2, "2026-09-07T02:22:00+00:00", claim_id="c1", next_action="ambiguous"),
                  ]
                  state = self.reduce(events, "2026-09-07T02:25:00+00:00")
                  self.assertEqual("LEASED", state["dispatch_state"])
                  self.assertEqual("c1", state["claim_id"])

              def test_post_cutover_explicit_continuation_remains_dispatchable(self):
                  events = [
                      claim(),
                      event("HANDOFF", 2, "2026-09-07T02:22:00+00:00", claim_id="c1", next_action="continue", handoff_scope="CONTINUATION"),
                  ]
                  state = self.reduce(events, "2026-09-07T02:25:00+00:00")
                  self.assertEqual("HANDOFF_READY", state["state"])
                  self.assertEqual("NEEDS_DISPATCH", state["dispatch_state"])

              def test_post_cutover_explicit_frozen_return_waits_review(self):
                  events = [
                      claim(),
                      event("HANDOFF", 2, "2026-09-07T02:22:00+00:00", claim_id="c1", next_action="Driver review", handoff_scope="FROZEN_RETURN_AWAITING_DRIVER_REVIEW"),
                  ]
                  state = self.reduce(events, "2026-09-07T02:25:00+00:00")
                  self.assertEqual("FROZEN_RETURN", state["state"])
                  self.assertEqual("AWAITING_REVIEW", state["dispatch_state"])

              def test_pre_cutover_plain_handoff_remains_legacy_compatible(self):
                  events = [
                      claim(at="2026-09-07T02:18:00+00:00"),
                      event("HANDOFF", 2, "2026-09-07T02:19:00+00:00", claim_id="c1", next_action="legacy continuation"),
                  ]
                  state = self.reduce(events, "2026-09-07T02:19:30+00:00")
                  self.assertEqual("HANDOFF_READY", state["state"])
                  self.assertEqual("NEEDS_DISPATCH", state["dispatch_state"])

              def test_scoped_correction_before_expiry_supersedes_ambiguous_handoff(self):
                  events = [
                      claim(),
                      event("HANDOFF", 2, "2026-09-07T02:22:00+00:00", claim_id="c1", next_action="ambiguous"),
                      event("HANDOFF", 3, "2026-09-07T02:24:00+00:00", claim_id="c1", next_action="Driver review", result_id="RR-CORRECTED"),
                  ]
                  state = self.reduce(events, "2026-09-07T02:25:00+00:00")
                  self.assertEqual("FROZEN_RETURN", state["state"])
                  self.assertEqual("AWAITING_REVIEW", state["dispatch_state"])
                  self.assertEqual("RR-CORRECTED", state["result_id"])

          if __name__ == "__main__":
              unittest.main()
          PY

          # Legacy exact terminal_candidate regression.
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_result_handoff_dispatch_guard.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    def test_plain_handoff_remains_dispatchable(self):\n'
          addition = '''    def test_legacy_terminal_candidate_waits_for_driver_review(self):\n        state = self.reduce({\n            "terminal_candidate": "SUCCESS_REVIEW_COMPLETE_AWAITING_DRIVER_DECISION"\n        })\n        self.assertEqual("FROZEN_RETURN", state["state"])\n        self.assertEqual("AWAITING_REVIEW", state["dispatch_state"])\n\n'''
          if 'test_legacy_terminal_candidate_waits_for_driver_review' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('result guard test anchor mismatch')
              text = text.replace(anchor, addition + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python -m unittest -v \
            tests.test_result_handoff_dispatch_guard \
            tests.test_registered_handoff_scope_guard \
            tests.test_registered_done_dispatch_guard \
            tests.test_control_plane_adversarial_simulation \
            tests.test_chatgpt_dispatch_bridge_replay_guard

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/control-handoff-scope-contract-patch.yml
          git add tools/research_runtime_reducer.py tools/research_dispatch.py \
            tests/test_result_handoff_dispatch_guard.py tests/test_registered_handoff_scope_guard.py \
            .github/workflows/control-plane-pr-focused-validation.yml \
            docs/RESEARCH_SCHEDULING_PROTOCOL.en.md \
            .github/workflows/control-handoff-scope-contract-patch.yml
          git commit -m "control: require explicit post-cutover HANDOFF scope"
          git push origin HEAD:control/terminal-scope-review-barrier-20260907
