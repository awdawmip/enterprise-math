name: brc-full-powered-ratio-jet-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_FULL_POWERED_RATIO_JET_20260903.md'
      - 'experiments/brc_full_powered_ratio_jet_check.py'
      - '.github/workflows/brc-full-powered-ratio-jet-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC full powered branch-ratio jet checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_full_powered_ratio_jet_check.py
