name: brc-full-powered-ratio-jet-research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC full powered branch-ratio jet checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_full_powered_ratio_jet_check.py
