name: control-terminal-scope-live-probe

on:
  push:
    branches:
      - control/terminal-scope-review-barrier-20260907
    paths:
      - '.github/workflows/control-terminal-scope-live-probe.yml'

permissions:
  contents: write
  issues: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Replay live Issue 240
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/issues/240/comments?per_page=100" \
            --jq '.[]' | jq -s '.' > /tmp/issue240.json
          set +e
          python research_control_dispatch.py --events /tmp/issue240.json --kind RESEARCH > /tmp/route.json
          rc=$?
          set -e
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then
            cat /tmp/route.json
            exit "$rc"
          fi
          jq '{action,target_key,target:(.target // null | {task_id,publication_id,state,dispatch_state,next_action}), issue_comments:'"$(jq length /tmp/issue240.json)"'}' /tmp/route.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/control-terminal-scope-live-probe.yml
          git add .github/workflows/control-terminal-scope-live-probe.yml
          git commit -m "control: remove terminal-scope live probe"
          git push origin HEAD:control/terminal-scope-review-barrier-20260907
