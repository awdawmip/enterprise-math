name: brc-weighted-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_WEIGHTED_LOG_SEMIRING_EXTENSION_20260902.md'
      - 'research_notes/BRC_WEIGHTED_MULTIPLICITY_TOWER_20260902.md'
      - 'research_notes/BRC_WEIGHTED_CWM_SAFE_QUOTIENT_20260902.md'
      - 'research_notes/BRC_WEIGHTED_LOCAL_BISIMULATION_BOUNDARY_20260902.md'
      - 'research_notes/BRC_WEIGHTED_CWM_REALIZABILITY_CORRECTION_20260902.md'
      - 'research_notes/BRC_WEIGHTED_PROJECTIVE_GAUGE_QUOTIENT_20260902.md'
      - 'research_notes/BRC_CYCLIC_LOG_MULTIPLICITY_CLOSURE_20260902.md'
      - 'experiments/brc_weighted_log_semiring_check.py'
      - 'experiments/brc_weighted_rational_runtime_prototype.py'
      - 'experiments/brc_weighted_multiplicity_tower_check.py'
      - 'experiments/brc_weighted_cwm_safe_quotient_check.py'
      - 'experiments/brc_weighted_local_bisimulation_boundary_check.py'
      - 'experiments/brc_weighted_cwm_realizability_check.py'
      - 'experiments/brc_weighted_projective_gauge_check.py'
      - 'experiments/brc_cyclic_log_multiplicity_check.py'
      - '.github/workflows/brc-weighted-research.yml'
  push:
    branches: [main]
    paths:
      - 'research_notes/BRC_WEIGHTED_LOG_SEMIRING_EXTENSION_20260902.md'
      - 'research_notes/BRC_WEIGHTED_MULTIPLICITY_TOWER_20260902.md'
      - 'research_notes/BRC_WEIGHTED_CWM_SAFE_QUOTIENT_20260902.md'
      - 'research_notes/BRC_WEIGHTED_LOCAL_BISIMULATION_BOUNDARY_20260902.md'
      - 'research_notes/BRC_WEIGHTED_CWM_REALIZABILITY_CORRECTION_20260902.md'
      - 'research_notes/BRC_WEIGHTED_PROJECTIVE_GAUGE_QUOTIENT_20260902.md'
      - 'research_notes/BRC_CYCLIC_LOG_MULTIPLICITY_CLOSURE_20260902.md'
      - 'experiments/brc_weighted_log_semiring_check.py'
      - 'experiments/brc_weighted_rational_runtime_prototype.py'
      - 'experiments/brc_weighted_multiplicity_tower_check.py'
      - 'experiments/brc_weighted_cwm_safe_quotient_check.py'
      - 'experiments/brc_weighted_local_bisimulation_boundary_check.py'
      - 'experiments/brc_weighted_cwm_realizability_check.py'
      - 'experiments/brc_weighted_projective_gauge_check.py'
      - 'experiments/brc_cyclic_log_multiplicity_check.py'
      - '.github/workflows/brc-weighted-research.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact finite-DAG weighted support checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_weighted_log_semiring_check.py
      - name: Exact rational Weighted-BRC / LN integration prototype
        env:
          PYTHONPATH: src
        run: python experiments/brc_weighted_rational_runtime_prototype.py
      - name: Exact count/max/log multiplicity tower checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_weighted_multiplicity_tower_check.py
      - name: Exact CWM semiring and all-prefix safe quotient checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_weighted_cwm_safe_quotient_check.py
      - name: Exact local-bisimulation strictness counterexample
        env:
          PYTHONPATH: src
        run: python experiments/brc_weighted_local_bisimulation_boundary_check.py
      - name: Exact positive-path CWM realizability correction checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_weighted_cwm_realizability_check.py
      - name: Exact projective gauge-compensated quotient checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_weighted_projective_gauge_check.py
      - name: Exact cyclic log-multiplicity closure checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_cyclic_log_multiplicity_check.py
