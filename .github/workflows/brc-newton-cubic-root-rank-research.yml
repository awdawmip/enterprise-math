name: brc-newton-cubic-root-rank-research

on:
  pull_request:
    paths:
      - "experiments/brc_newton_cubic_root_rank_selector_check.py"
      - "research_notes/BRC_NEWTON_CUBIC_ROOT_RANK_SELECTOR_20260904.md"
      - ".github/workflows/brc-newton-cubic-root-rank-research.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exact cubic root-rank selector checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_newton_cubic_root_rank_selector_check.py
