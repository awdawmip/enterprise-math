name: euler-character-completion

on:
  workflow_dispatch:

jobs:
  finite-and-formal-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile finite checker
        run: python -m py_compile src/enterprise_math/euler_character_completion.py tests/test_euler_character_completion.py
      - name: Run isolated completion regression
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests/test_euler_character_completion.py
      - name: Reject proof placeholders
        run: |
          if grep -R -n -E '\b(sorry|admit)\b' EnterpriseMath/Precision/EulerCharacterCompletion.lean; then
            echo "Proof placeholder detected"
            exit 1
          fi
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Build finite Lean uniqueness and mean identities
        run: lake build --wfail -KCI EnterpriseMath.Precision.EulerCharacterCompletion
