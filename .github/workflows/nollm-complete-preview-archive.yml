name: Nollm complete preview archive
on:
  push:
    branches: [tool/nollm-full-archive-20260916-c6c82]
    paths:
      - .github/workflows/nollm-complete-preview-archive.yml
      - tools/nollm_visual_toolkit/publication/build_archive.py
      - tools/nollm_visual_toolkit/publication/scale_audit.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nollm-complete-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'awdawmip/enterprise-math' && github.ref == 'refs/heads/tool/nollm-full-archive-20260916-c6c82'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read the exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Install browser verification dependencies
        run: |
          python3 -m pip install 'playwright==1.57.0' wheel setuptools
          python3 -m playwright install --with-deps chromium
      - name: Build full pages, data, source snapshot, screenshots, wheel and ZIP
        run: |
          python3 tools/nollm_visual_toolkit/publication/build_archive.py \
            --out tools/nollm_visual_toolkit/published/multiplication-lab-0.1.0
      - name: Preserve output without overwriting a moving branch
        env:
          OUTPUT: tools/nollm_visual_toolkit/published/multiplication-lab-0.1.0
        run: |
          set -euo pipefail
          current=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$current" = "$GITHUB_SHA" || { echo 'Source branch moved; output remains in this job, no force push.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$OUTPUT"
          git diff --cached --quiet && exit 0
          git commit -m 'build(research-tools): archive full multiplication pages, source, evidence and scale audit'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
