name: brc-newton-nonsplit-quadratic-selector-chamber-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_NEWTON_NONSPLIT_QUADRATIC_SELECTOR_CHAMBER_20260904.md'
      - 'experiments/brc_newton_nonsplit_quadratic_selector_chamber_check.py'
      - '.github/workflows/brc-newton-nonsplit-quadratic-selector-chamber-research.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC non-split quadratic selector chamber checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_newton_nonsplit_quadratic_selector_chamber_check.py
