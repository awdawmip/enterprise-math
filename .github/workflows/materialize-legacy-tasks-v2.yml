name: materialize-legacy-tasks-v2

on:
  push:
    branches:
      - control/legacy-control-plane-migration-20260902
    paths:
      - '.github/workflows/materialize-legacy-tasks-v2.yml'
      - 'control_plane/materialize_legacy_tasks_v2.py'
      - 'control_plane/run_legacy_task_migration_safe.py'

permissions:
  contents: write
  issues: read

concurrency:
  group: materialize-legacy-tasks-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch authenticated Issue 240 history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp 'repos/${{ github.repository }}/issues/240/comments?per_page=100' > /tmp/issue240-comments.json
      - name: Materialize exact V2 task generations
        run: python control_plane/run_legacy_task_migration_safe.py --comments /tmp/issue240-comments.json
      - name: Validate only the exact migration transaction
        run: python control_plane/run_legacy_task_migration_safe.py --check
      - name: Commit migration transaction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_tasks/LEGACY_CONTROL_MIGRATION_* research_task_records control_plane/legacy_control_migration_manifest.json
          if git diff --cached --quiet; then
            echo 'Migration transaction already materialized.'
            exit 0
          fi
          git commit -m 'control: migrate legacy tasks to immutable V2 records'
          git push origin HEAD:${{ github.ref_name }}
