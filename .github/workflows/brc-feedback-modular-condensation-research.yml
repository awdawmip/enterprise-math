name: brc-feedback-modular-condensation-research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC modular feedback condensation checker
        run: python experiments/brc_feedback_modular_condensation_check.py
