name: brc-recurrent-moment-completeness-research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact recurrent branch moment-lift checker
        run: python experiments/brc_recurrent_branch_moment_lift_check.py
      - name: Exact finite branch-moment completeness checker
        run: python experiments/brc_recurrent_branch_moment_completeness_check.py
