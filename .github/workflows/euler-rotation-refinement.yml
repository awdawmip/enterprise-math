name: euler-rotation-refinement

on:
  pull_request:
    paths:
      - "research_notes/EULER_CELL_GATE_DYADIC_ROTATION_TOWER_20260903.md"
      - "research_notes/EULER_ROTATION_COVER_AND_WINDING_GEOMETRY_20260903.md"
      - "research_notes/EULER_ROTATION_REFINEMENT_THEOREM_LEDGER_20260903.json"
      - "research_notes/EULER_ROTATION_COVER_THEOREM_ADDENDUM_20260903.json"
      - "research_notes/EULER_CELL_RADIUS_NORMALIZED_BISECTOR_COMPLETION_20260903.md"
      - "research_notes/EULER_CELL_RADIUS_BISECTOR_THEOREM_LEDGER_20260903.json"
      - "src/enterprise_math/euler_rotation_refinement.py"
      - "src/enterprise_math/euler_native_bisector.py"
      - "tests/test_euler_rotation_refinement.py"
      - "tests/test_euler_native_bisector.py"
      - "EnterpriseMath/Precision/EulerCellRadiusBisector.lean"
      - "research_method_inventory_addenda/20260903_euler_rotation_refinement.json"
      - "research_method_inventory_addenda/20260903_euler_native_bisector.json"
      - ".github/workflows/euler-rotation-refinement.yml"
  workflow_dispatch:

jobs:
  finite-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile exact checkers and regressions
        run: |
          python -m py_compile \
            src/enterprise_math/euler_rotation_refinement.py \
            src/enterprise_math/euler_native_bisector.py \
            tests/test_euler_rotation_refinement.py \
            tests/test_euler_native_bisector.py
      - name: Run isolated finite theorem regressions
        env:
          PYTHONPATH: src
        run: |
          python -m unittest -v \
            tests/test_euler_rotation_refinement.py \
            tests/test_euler_native_bisector.py

  lean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Compile the Euler Cell-radius bisector proofs with warnings fatal
        run: lake build --wfail -KCI EnterpriseMath.Precision.EulerCellRadiusBisector
