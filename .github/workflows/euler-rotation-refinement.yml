name: euler-rotation-refinement

on:
  workflow_dispatch:

jobs:
  finite-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile exact checkers and regressions
        run: |
          python -m py_compile \
            src/enterprise_math/euler_rotation_refinement.py \
            src/enterprise_math/euler_native_bisector.py \
            src/enterprise_math/euler_dyadic_cayley_bridge.py \
            tests/test_euler_rotation_refinement.py \
            tests/test_euler_native_bisector.py \
            tests/test_euler_dyadic_cayley_bridge.py
      - name: Run isolated finite theorem regressions
        env:
          PYTHONPATH: src
        run: |
          python -m unittest -v \
            tests/test_euler_rotation_refinement.py \
            tests/test_euler_native_bisector.py \
            tests/test_euler_dyadic_cayley_bridge.py

  lean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Compile the Euler Cell-radius and Cayley proofs with warnings fatal
        run: lake build --wfail -KCI EnterpriseMath.Precision.EulerPhysicalGate EnterpriseMath.Precision.EulerCayleyBridge
