name: euler-rotation-refinement

on:
  pull_request:
    paths:
      - "research_notes/EULER_CELL_GATE_DYADIC_ROTATION_TOWER_20260903.md"
      - "research_notes/EULER_ROTATION_REFINEMENT_THEOREM_LEDGER_20260903.json"
      - "src/enterprise_math/euler_rotation_refinement.py"
      - "tests/test_euler_rotation_refinement.py"
      - "research_method_inventory_addenda/20260903_euler_rotation_refinement.json"
      - ".github/workflows/euler-rotation-refinement.yml"
  workflow_dispatch:

jobs:
  finite-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile checker and regression
        run: python -m py_compile src/enterprise_math/euler_rotation_refinement.py tests/test_euler_rotation_refinement.py
      - name: Run isolated finite theorem regression
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests/test_euler_rotation_refinement.py
