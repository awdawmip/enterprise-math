name: control-terminal-scope-patch

on:
  push:
    branches:
      - control/terminal-scope-review-barrier-20260907
    paths:
      - '.github/workflows/control-terminal-scope-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact reducer patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/research_runtime_reducer.py')
          text = path.read_text(encoding='utf-8')

          old = '''EVENT_SCHEMA = "ENTERPRISE_MATH_SCHEDULER_EVENT_V1"\nPOLICY_SCHEMA = "ENTERPRISE_MATH_RESEARCH_RUNTIME_POLICY_V2"\n'''
          new = '''EVENT_SCHEMA = "ENTERPRISE_MATH_SCHEDULER_EVENT_V1"\nPOLICY_SCHEMA = "ENTERPRISE_MATH_RESEARCH_RUNTIME_POLICY_V2"\nDRIVER_REVIEW_TERMINAL_SCOPE = "RESEARCH_RETURN_FROZEN_AWAITING_DRIVER_REVIEW"\n'''
          if text.count(old) != 1:
              raise SystemExit('constant patch anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''            result_id = event.get("result_id")\n            if result_id is not None and (not isinstance(result_id, str) or not result_id.strip()):\n                ignore(state, index, "HANDOFF result_id must be a nonempty string when supplied")\n                continue\n            # A result-bearing HANDOFF is a provisional review barrier even before\n            # the immutable result record lands on main.  Plain HANDOFF remains a\n            # researcher-to-researcher continuation surface.\n            state["state"] = "FROZEN_RETURN" if result_id is not None else "HANDOFF_READY"\n            if isinstance(result_id, str):\n                state["result_id"] = result_id.strip()\n            else:\n                state.pop("result_id", None)\n'''
          new = '''            result_id = event.get("result_id")\n            if result_id is not None and (not isinstance(result_id, str) or not result_id.strip()):\n                ignore(state, index, "HANDOFF result_id must be a nonempty string when supplied")\n                continue\n            terminal_scope = event.get("terminal_scope")\n            driver_review_terminal = terminal_scope == DRIVER_REVIEW_TERMINAL_SCOPE\n            # A result-bearing HANDOFF or the exact legacy frozen-return terminal\n            # scope is a provisional review barrier even before an immutable result\n            # record lands on main.  Plain HANDOFF remains a researcher-to-researcher\n            # continuation surface.  Unknown terminal_scope values carry no authority.\n            state["state"] = (\n                "FROZEN_RETURN"\n                if result_id is not None or driver_review_terminal\n                else "HANDOFF_READY"\n            )\n            if isinstance(result_id, str):\n                state["result_id"] = result_id.strip()\n            else:\n                state.pop("result_id", None)\n            if driver_review_terminal:\n                state["terminal_scope"] = DRIVER_REVIEW_TERMINAL_SCOPE\n            else:\n                state.pop("terminal_scope", None)\n'''
          if text.count(old) != 1:
              raise SystemExit('HANDOFF patch anchor mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python -m unittest -v \
            tests.test_result_handoff_dispatch_guard \
            tests.test_registered_done_dispatch_guard \
            tests.test_control_plane_adversarial_simulation \
            tests.test_chatgpt_dispatch_bridge_replay_guard

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/control-terminal-scope-patch.yml
          git add tools/research_runtime_reducer.py .github/workflows/control-terminal-scope-patch.yml
          git commit -m "control: honor explicit Driver-review terminal scope"
          git push origin HEAD:control/terminal-scope-review-barrier-20260907
