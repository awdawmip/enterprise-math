name: patch-common-surface-v2-once

on:
  push:
    branches:
      - control/finalize-task-record-section-adapters-20260902
    paths:
      - '.github/workflows/patch-common-surface-v2-once.yml'

permissions:
  contents: write

concurrency:
  group: patch-common-surface-v2-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Patch only the V2 runtime assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/check_research_common_surface.py')
          text = path.read_text(encoding='utf-8')

          old_schema = 'if runtime.get("schema") != "ENTERPRISE_MATH_RESEARCH_RUNTIME_STATE_MACHINE_V1":'
          new_schema = 'if runtime.get("schema") != "ENTERPRISE_MATH_RESEARCH_RUNTIME_STATE_MACHINE_V2":'
          if text.count(old_schema) != 1:
              raise SystemExit(f'expected one old runtime schema assertion, found {text.count(old_schema)}')
          text = text.replace(old_schema, new_schema, 1)

          old_runtime = '''    primitive = runtime.get("composes", {}).get("pre_final_primitive")
              if not isinstance(primitive, str) or primitive not in entries:
                  raise AssertionError("runtime PRE_FINAL primitive must appear in repository_tool_paths")
          '''
          new_runtime = '''    required_fields = {
                  "event_reducer": "tools/research_runtime_reducer.py",
                  "fresh_task_selector": "tools/research_dispatch.py",
                  "fresh_lane_selector": "tools/research_lane_dispatch.py",
              }
              for field, expected in required_fields.items():
                  if runtime.get(field) != expected or expected not in entries:
                      raise AssertionError(
                          f"runtime {field} must equal {expected!r} and appear in repository_tool_paths"
                      )
              if runtime.get("canonical_live_dispatch") != "research_control_dispatch.py":
                  raise AssertionError(
                      "runtime canonical_live_dispatch must be research_control_dispatch.py"
                  )
              if "tools/active_turn_liveness.py" not in entries:
                  raise AssertionError(
                      "runtime active-turn primitive must appear in repository_tool_paths"
                  )
          '''
          # Triple-quoted indentation above is intentionally normalized here.
          old_runtime = old_runtime.replace('              ', '    ')
          new_runtime = new_runtime.replace('              ', '    ')
          if text.count(old_runtime) != 1:
              raise SystemExit(f'expected one old runtime primitive block, found {text.count(old_runtime)}')
          text = text.replace(old_runtime, new_runtime, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit exact-span checker update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/check_research_common_surface.py
          git diff --cached --check
          git commit -m 'control: align common-surface checker with V2 runtime'
          git push origin HEAD:${{ github.ref_name }}
