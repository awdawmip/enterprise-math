name: review-audit-quarantine-apply

on:
  push:
    branches:
      - control/perfect-prime-publication-quarantine-resolution-20260831
    paths:
      - ".github/workflows/review-audit-quarantine-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate exact invalid-review registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from collections import defaultdict
          from pathlib import Path

          ROOT=Path.cwd()
          from control_plane import research_result_review_binding_fault_isolation as binding
          from control_plane import research_result_review_audit_fault_isolation as audit_iso
          from control_plane import research_result_records_impl as impl

          # Preserve the already-authorized stale-binding filter first.
          binding.install(ROOT)
          from tools import research_result_records
          errors=research_result_records.audit(ROOT)
          by_path=defaultdict(list)
          for e in errors:
              if e.startswith("research_result_reviews/") and ": " in e:
                  p,s=e.split(": ",1); by_path[p].append(s)

          raw_reviews={x.get("_review_path"):x for x in audit_iso._raw_reviews(ROOT)}
          raw_results={str(x.get("result_id")):x for x in audit_iso._raw_results(ROOT) if isinstance(x.get("result_id"),str)}
          entries=[]; unclassified=[]
          for path in sorted(by_path):
              review=raw_reviews.get(path)
              if not isinstance(review,dict):
                  unclassified.append({"path":path,"reason":"review_missing"}); continue
              rid=review.get("result_id")
              result=raw_results.get(str(rid))
              if not isinstance(result,dict):
                  unclassified.append({"path":path,"review_id":review.get("review_id"),"reason":"result_missing"}); continue
              expected=sorted(set(by_path[path]))
              actual=audit_iso._review_errors(review,result,ROOT)
              if actual!=expected:
                  unclassified.append({"path":path,"review_id":review.get("review_id"),"expected":expected,"actual":actual,"reason":"strict_error_set_mismatch"}); continue
              entries.append({
                  "review_id":review["review_id"],
                  "result_id":result["result_id"],
                  "task_id":result["task_id"],
                  "review_record_path":path,
                  "review_record_blob_sha1":audit_iso._blob(ROOT/path),
                  "result_record_path":result["_record_path"],
                  "result_record_blob_sha1":audit_iso._blob(ROOT/result["_record_path"]),
                  "state":"INVALID_IMMUTABLE_REVIEW_RECORD",
                  "operational":False,
                  "history_preserved":True,
                  "allowed_review_audit_errors":expected,
                  "reason":"Exact immutable review bytes fail the current V1 review-record audit. CONTROL_PLANE_MAINTENANCE preserves the review as nonoperational history and removes only this invalid review record from operational Driver-review authority; it does not infer or repair any disposition.",
                  "working_truth_granted":False,
                  "foundation_authority_granted":False,
                  "canonical_promotion_granted":False,
                  "successor_triggered":False,
              })

          if unclassified:
              raise SystemExit("UNCLASSIFIED_REVIEW_AUDIT="+json.dumps(unclassified,ensure_ascii=False))
          if len(entries)!=15:
              raise SystemExit(f"expected 15 exact invalid reviews, got {len(entries)}")
          if len({x['review_id'] for x in entries})!=15:
              raise SystemExit("duplicate review_id in proposed quarantine")

          payload={
              "schema":"ENTERPRISE_MATH_RESULT_REVIEW_AUDIT_QUARANTINE_V1",
              "status":"ACTIVE",
              "purpose":"Exact fail-closed isolation of immutable Driver-review records that fail current V1 review-record integrity. Rows are byte-pinned and must reproduce the complete strict review error set. History is preserved; no disposition or authority is inferred.",
              "entries":entries,
          }
          out=ROOT/"research_result_review_audit_quarantines.json"
          if out.exists(): raise SystemExit("review audit quarantine registry already exists")
          out.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          # Re-run the independent validator on the proposed bytes.
          validated=audit_iso.validated_rows(ROOT)
          if set(validated)!={x['review_id'] for x in entries}:
              raise SystemExit("validator cardinality mismatch")
          print(f"REVIEW_AUDIT_QUARANTINE_EXACT=PASS count={len(entries)}")
          PY
          test "$(git diff --name-only)" = "research_result_review_audit_quarantines.json"
          git diff --check
      - name: Commit exact invalid-review registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "enterprise-math-control-bot"
          git config user.email "enterprise-math-control-bot@users.noreply.github.com"
          git add research_result_review_audit_quarantines.json
          git commit -m "[CONTROL] isolate exact invalid historical reviews"
          git push origin HEAD:control/perfect-prime-publication-quarantine-resolution-20260831
