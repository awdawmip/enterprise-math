name: brc-recurrent-port-foundation

on:
  pull_request:
    paths:
      - 'definitions/ENTERPRISE_BRC_RECURRENT_PORT_FOUNDATION_20260903.md'
      - 'definitions/ENTERPRISE_BRC_RECURRENT_PORT_THEOREM_LEDGER_20260903.json'
      - 'definitions/ENTERPRISE_BRC_WEIGHTED_GLOBAL_SUBSTRATE_20260902.json'
      - 'research_method_inventory_addenda/20260903_brc_recurrent_port_foundation.json'
      - 'src/enterprise_math/brc_recurrent_ports.py'
      - 'src/enterprise_math/__init__.py'
      - 'tests/test_brc_recurrent_port_foundation.py'
      - 'experiments/check_brc_recurrent_port_foundation.py'
      - '.github/workflows/brc-recurrent-port-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recurrent port production subtool
        env:
          PYTHONPATH: src
        run: python -m unittest tests/test_brc_recurrent_port_foundation.py
      - name: Recurrent port Foundation integrity
        run: python experiments/check_brc_recurrent_port_foundation.py
      - name: Schur-collapse research regression
        run: python experiments/brc_recurrent_schur_collapse_check.py
      - name: Port-context research regression
        run: python experiments/brc_port_contextual_equivalence_check.py
      - name: Parent recurrent interaction Foundation remains consistent
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests/test_brc_recurrent_interaction_foundation.py
          python experiments/check_brc_recurrent_interaction_foundation.py
      - name: Toolbox discovers recurrent port collapse
        run: |
          python tools/enterprise_toolbox.py --json methods recurrent port collapse > /tmp/port.json
          grep -q 't0.weighted_brc_recurrent_port_collapse' /tmp/port.json
          python tools/enterprise_toolbox.py --json modules recurrent port > /tmp/port-module.json
          grep -q 'module:brc_recurrent_ports' /tmp/port-module.json
