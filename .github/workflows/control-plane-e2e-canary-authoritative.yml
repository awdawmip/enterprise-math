name: control-plane-e2e-canary-authoritative

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/control-plane-e2e-canary-authoritative.yml"

concurrency:
  group: control-plane-e2e-canary-authoritative
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  repository-canary:
    name: control-plane-repository-canary-authoritative
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reconcile branch-protection contract against live main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python control_plane/check_branch_protection_contract.py
          --receipt /tmp/branch-protection-receipt.json
      - name: Run repository-side turn and immutable-handoff canary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python control_plane/e2e_canary.py
          --repository "${{ github.repository }}"
          --receipt /tmp/control-plane-e2e-receipt.json
      - uses: actions/upload-artifact@v6
        with:
          name: control-plane-authoritative-receipts-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/branch-protection-receipt.json
            /tmp/control-plane-e2e-receipt.json

  live-supervisor-canary:
    name: control-plane-live-supervisor-canary-authoritative
    needs: repository-canary
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.sha }}
      TARGET_WORKFLOW: cloudflare-supervisor.yml
      PIN_TAG: control-canary-authoritative-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for all earlier Supervisor dispatches to terminate
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            active="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&per_page=100" \
              | jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length'
            )"
            if [[ "$active" == "0" ]]; then
              echo "SUPERVISOR_DISPATCH_LANE=IDLE"
              exit 0
            fi
            sleep 10
          done
          echo "SUPERVISOR_DISPATCH_LANE_DID_NOT_QUIESCE"
          exit 1

      - name: Create an immutable one-run dispatch ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "$PIN_TAG" "$TARGET_SHA"
          git push origin "refs/tags/$PIN_TAG"
          test "$(git rev-parse "$PIN_TAG^{commit}")" = "$TARGET_SHA"

      - name: Dispatch and locate the exact production-authenticated Supervisor smoke
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          triggered_epoch="$(date -u +%s)"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            -f ref="$PIN_TAG"
          run_id=""
          for _ in $(seq 1 40); do
            candidate="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=workflow_dispatch&per_page=100" \
              | jq -r \
                  --arg sha "$TARGET_SHA" \
                  --arg ref "$PIN_TAG" \
                  --argjson epoch "$triggered_epoch" \
                  '.workflow_runs
                   | map(select(.head_sha == $sha and .head_branch == $ref))
                   | map(select((.created_at | fromdateiso8601) >= $epoch))
                   | sort_by(.created_at)
                   | last
                   | .id // empty'
            )"
            if [[ -n "$candidate" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Require terminal live Supervisor success
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          status=""
          conclusion=""
          for _ in $(seq 1 120); do
            row="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
            status="$(jq -r '.status' <<<"$row")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$row")"
            [[ "$status" == "completed" ]] && break
            sleep 15
          done
          test "$status" = completed
          if [[ "$conclusion" != success ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              | jq '{jobs:[.jobs[]|{name,status,conclusion,html_url}]}'
            exit 1
          fi
          echo "LIVE_SUPERVISOR_CANARY_AUTHORITATIVE=PASS run_id=$RUN_ID head_sha=$TARGET_SHA"

      - name: Remove the one-run dispatch ref
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git push origin ":refs/tags/$PIN_TAG" || true
          if git ls-remote --exit-code --tags origin "refs/tags/$PIN_TAG" >/dev/null 2>&1; then
            echo "PIN_TAG_CLEANUP_FAILED tag=$PIN_TAG"
            exit 1
          fi
          echo "PIN_TAG_CLEANUP=PASS tag=$PIN_TAG"

  final-gate:
    name: control-plane-e2e-canary-authoritative-gate
    if: always()
    needs:
      - repository-canary
      - live-supervisor-canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both authoritative chains
        env:
          REPOSITORY_RESULT: ${{ needs.repository-canary.result }}
          LIVE_RESULT: ${{ needs.live-supervisor-canary.result }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_RESULT" = success
          test "$LIVE_RESULT" = success
          echo "CONTROL_PLANE_E2E_CANARY_AUTHORITATIVE_GATE=PASS"
