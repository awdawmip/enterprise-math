name: materialize-q24-control-fix

on:
  push:
    branches:
      - control/github-enforcement-e2e-canary-20260901
    paths:
      - '.github/workflows/materialize-q24-control-fix.yml'
      - 'control_plane/materialize_q24_compat_and_review_quarantine.py'

permissions:
  contents: write

concurrency:
  group: materialize-q24-control-fix
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: control/github-enforcement-e2e-canary-20260901
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Materialize exact compatibility and quarantine rows
        run: python control_plane/materialize_q24_compat_and_review_quarantine.py

      - name: Validate materialized control view
        run: |
          python -m json.tool research_result_record_compatibility.json >/dev/null
          python -m json.tool research_result_review_audit_quarantines.json >/dev/null
          python control_plane/check_result_review_binding_fault_isolated.py

      - name: Commit materialized registries and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-q24-control-fix.yml
          git rm control_plane/materialize_q24_compat_and_review_quarantine.py
          git add research_result_record_compatibility.json research_result_review_audit_quarantines.json
          git commit -m "control: isolate invalid Q22-Q24 review metadata exactly"
          git push origin HEAD:control/github-enforcement-e2e-canary-20260901
