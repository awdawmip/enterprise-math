name: brc-newton-one-parameter-selector-event-research

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exact one-parameter selector event checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_newton_one_parameter_selector_event_check.py
