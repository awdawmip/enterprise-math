name: control-router-import-hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/control-router-import-hotfix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Repair all stale pre-V2 scheduler imports fail-fast
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          echo 'Pre-repair Python references:'
          git grep -n 'research_scheduler' -- '*.py' || true
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_exact(path_text, replacements, label):
              p = Path(path_text)
              text = p.read_text(encoding='utf-8')
              for old, new, expected in replacements:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{label}: expected {expected} occurrences of {old!r}, found {count}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          replace_exact(
              'research_control_dispatch.py',
              [
                  ('from tools import research_scheduler\n', 'from datetime import datetime, timezone\n', 1),
                  ('    now = research_scheduler.now_utc(args.now)\n', '    now = research_runtime.parse_time(args.now) if args.now else datetime.now(timezone.utc)\n', 1),
              ],
              'router',
          )
          replace_exact(
              'tools/research_lane_claims.py',
              [
                  ('    from tools import research_scheduler\n', '    from tools import research_runtime_reducer\n', 1),
                  ('    import research_scheduler  # type: ignore\n', '    import research_runtime_reducer  # type: ignore\n', 1),
                  ('research_scheduler.reduce_task(', 'research_runtime_reducer.reduce_task(', 2),
              ],
              'lane claims',
          )
          replace_exact(
              'tools/research_lane_dispatch.py',
              [
                  ('    from tools import research_scheduler\n', '    from tools import research_runtime_reducer\n', 1),
                  ('    import research_scheduler  # type: ignore\n', '    import research_runtime_reducer  # type: ignore\n', 1),
                  ('    now = research_scheduler.now_utc(args.now)\n', '    now = research_runtime_reducer.now_utc(args.now)\n', 1),
              ],
              'lane dispatch',
          )

          qpath = Path('control_plane/task_integrity_quarantine_addendum_20260902.json')
          q = json.loads(qpath.read_text(encoding='utf-8'))
          target = 'RS-GEO8-BORSUK-R6-LASSAK-33-COMPRESSION-PRESSURE'
          rows = q.get('quarantines')
          if not isinstance(rows, list):
              raise SystemExit('quarantine registry has no quarantines list')
          matches = [row for row in rows if isinstance(row, dict) and row.get('task_id') == target]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one stale GEO8 quarantine row, found {len(matches)}')
          old = matches[0]
          if old.get('publication_id') != 'TP2-D425335E9566A3F6A54C':
              raise SystemExit('GEO8 quarantine no longer pins expected Gen1 publication')
          new_record = Path('research_task_records/RS-GEO8-BORSUK-R6-LASSAK-33-COMPRESSION-PRESSURE/TP2-75A6C3F81E2D094B67CF.json')
          if not new_record.exists():
              raise SystemExit('GEO8 corrected Gen2 publication is missing')
          new = json.loads(new_record.read_text(encoding='utf-8'))
          if new.get('supersedes_publication_id') != old.get('publication_id'):
              raise SystemExit('GEO8 corrected Gen2 does not directly supersede quarantined Gen1')
          q['quarantines'] = [row for row in rows if row is not old]
          qpath.write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          if git grep -n 'research_scheduler' -- '*.py'; then
            echo "ERROR: stale pre-V2 research_scheduler Python references remain after explicit migration" >&2
            exit 1
          fi
          python -m py_compile research_control_dispatch.py tools/research_lane_claims.py tools/research_lane_dispatch.py
          python research_control_dispatch.py --help >/dev/null
          python - <<'PY'
          import research_control_dispatch
          from tools import research_lane_claims, research_lane_dispatch
          print('PASS: canonical router and lane runtime import without legacy scheduler')
          PY
          python control_plane/check_publication_fault_isolation.py
          git rm .github/workflows/control-router-import-hotfix.yml
          git add research_control_dispatch.py tools/research_lane_claims.py tools/research_lane_dispatch.py control_plane/task_integrity_quarantine_addendum_20260902.json
          git commit -m "control: complete V2 scheduler consumer and quarantine reconciliation"
          git push origin HEAD:main
