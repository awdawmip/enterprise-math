name: brc-critical-primitive-orbit-euler-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_CRITICAL_PRIMITIVE_ORBIT_EULER_PRODUCT_20260903.md'
      - 'experiments/brc_critical_primitive_orbit_euler_check.py'
      - '.github/workflows/brc-critical-primitive-orbit-euler-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC critical primitive-orbit Euler checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_critical_primitive_orbit_euler_check.py
