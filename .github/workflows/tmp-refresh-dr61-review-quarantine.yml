name: tmp-refresh-dr61-review-quarantine

on:
  push:
    branches:
      - control/perfect-prime-publication-quarantine-resolution-20260831

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prove latest main removed the historical review artifact
        run: |
          git fetch origin main
          if git cat-file -e origin/main:driver_reviews/P000_BACKGROUND_S4_EQUIVARIANCE_GATE_V17_DRIVER_REVIEW_20260831.md 2>/dev/null; then
            echo 'historical review artifact still exists on main; refusing lifecycle change'
            exit 1
          fi
      - name: Refresh exact quarantine error set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research_result_review_audit_quarantines.json')
          data = json.loads(p.read_text())
          rows = [r for r in data['entries'] if r.get('review_id') == 'DR-61B4E8C29A705FD31746']
          assert len(rows) == 1, len(rows)
          row = rows[0]
          assert row['review_record_blob_sha1'] == 'sha1:f6718b76318b2535fbc66fa91fe47872dab4ea00'
          assert row['result_record_blob_sha1'] == 'sha1:e3396b62b8f69133fb1abafab4975179fcd31c79'
          assert row['allowed_review_audit_errors'] == [
              'result record digest drift',
              'review artifact digest drift',
          ]
          row['allowed_review_audit_errors'] = [
              'result record digest drift',
              'review artifact missing',
          ]
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          git diff --exit-code --quiet -- . ':!research_result_review_audit_quarantines.json'
          git diff -- research_result_review_audit_quarantines.json
      - name: Commit exact lifecycle refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_result_review_audit_quarantines.json
          git commit -m 'control: refresh DR-61 review quarantine after artifact retirement'
          git push origin HEAD:control/perfect-prime-publication-quarantine-resolution-20260831
