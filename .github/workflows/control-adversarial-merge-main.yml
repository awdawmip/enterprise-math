name: control-adversarial-merge-main

on:
  push:
    branches:
      - control/adversarial-control-simulation-20260906
    paths:
      - '.github/workflows/control-adversarial-merge-main.yml'

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Merge latest main and validate focused control suites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          python -m unittest -v tests.test_control_plane_adversarial_simulation
          python -m unittest -v tests.test_result_handoff_dispatch_guard
          python -m unittest -v tests.test_registered_done_dispatch_guard
          rm .github/workflows/control-adversarial-merge-main.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'control: remove transient main-merge helper'
          fi
          git push origin HEAD:control/adversarial-control-simulation-20260906
