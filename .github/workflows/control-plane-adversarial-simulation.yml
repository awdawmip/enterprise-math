name: control-plane-adversarial-simulation

on:
  push:
    branches:
      - control/adversarial-control-simulation-20260906
    paths:
      - 'tests/test_control_plane_adversarial_simulation.py'
      - 'tools/research_dispatch.py'
      - 'tools/research_runtime_reducer.py'
      - '.github/workflows/chatgpt-control-dispatch-bridge.yml'
      - '.github/workflows/control-plane-adversarial-simulation.yml'

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run lifecycle adversarial simulation
        run: python -m unittest -v tests.test_control_plane_adversarial_simulation
      - name: Run existing focused lifecycle regressions
        run: |
          python -m unittest -v tests.test_result_handoff_dispatch_guard
          python -m unittest -v tests.test_registered_done_dispatch_guard
