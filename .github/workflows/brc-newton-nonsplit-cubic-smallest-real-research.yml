name: brc-newton-nonsplit-cubic-smallest-real-research

on:
  pull_request:
    paths:
      - "experiments/brc_newton_nonsplit_cubic_smallest_real_chamber_check.py"
      - "research_notes/BRC_NEWTON_NONSPLIT_CUBIC_SMALLEST_REAL_CHAMBER_20260904.md"
      - ".github/workflows/brc-newton-nonsplit-cubic-smallest-real-research.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exact non-split cubic smallest-real chamber checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_newton_nonsplit_cubic_smallest_real_chamber_check.py
