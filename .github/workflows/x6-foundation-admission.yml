name: X6 signed spatial Foundation admission

on:
  pull_request:
    paths:
      - 'p000_reality_foundation.json'
      - 'definitions/00_CURRENT_NATIVE_FOUNDATION.md'
      - 'definitions/ENTERPRISE_X6_NATIVE_SPATIAL_CELL_TORSOR_20260905.md'
      - 'scripts/check_x6_foundation_admission.py'
      - 'experiments/x6_signed_native_spatial_v16_20260905/**'
      - 'experiments/x6_native_coordinate_completion_v7_20260905/**'
      - '.github/workflows/x6-foundation-admission.yml'
  workflow_dispatch:

jobs:
  x6-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full signed X6 exact regression
        run: python experiments/x6_signed_native_spatial_v16_20260905/check_x6_signed.py
      - name: Signed BRC endpoint kernel regression
        run: python experiments/x6_signed_native_spatial_v16_20260905/check_signed_brc.py
      - name: Relative observer regression
        run: python experiments/x6_native_coordinate_completion_v7_20260905/check_x6_coordinate.py
      - name: Foundation cross-file consistency
        run: python scripts/check_x6_foundation_admission.py
