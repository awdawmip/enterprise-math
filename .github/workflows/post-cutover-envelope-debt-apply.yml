name: post-cutover-envelope-debt-apply

on:
  workflow_dispatch:
  push:
    branches:
      - control/perfect-prime-publication-quarantine-resolution-20260831
    paths:
      - ".github/workflows/post-cutover-envelope-debt-apply.yml"

permissions:
  actions: read
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Download exact audited inventory artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/envelope-inventory
          mkdir -p /tmp/envelope-inventory
          gh run download 33344911376 \
            --repo "$GITHUB_REPOSITORY" \
            --name post-cutover-envelope-debt-inventory \
            --dir /tmp/envelope-inventory
      - name: Verify frozen inventory classification
        run: |
          set -euo pipefail
          summary=/tmp/envelope-inventory/summary.json
          jq -e '
            .schema == "ENTERPRISE_MATH_POST_CUTOVER_ENVELOPE_DEBT_INVENTORY_V1" and
            .raw_error_count == 123 and
            .record_count_with_errors == 28 and
            .global_error_count == 0 and
            .new_current_integrity_rows == 11 and
            .new_audit_only_rows == 17 and
            .unclassified_count == 0 and
            .records_with_declared_taskbook_pin_mismatch_or_missing == 2 and
            .classification_counts.AUDIT_DIRECTLY_SUPERSEDED == 16 and
            .classification_counts.AUDIT_FORK_BLOCKED_HEAD == 1 and
            .classification_counts.CURRENT_SOLE_HEAD_BLOCK == 11
          ' "$summary" >/dev/null
          test "$(jq 'length' /tmp/envelope-inventory/unclassified.json)" = "0"
          echo "ENVELOPE_DEBT_INVENTORY_FROZEN_COUNTS=PASS"
      - name: Apply only generated quarantine registries
        run: |
          set -euo pipefail
          cp /tmp/envelope-inventory/proposed_research_task_integrity_quarantines.json \
            research_task_integrity_quarantines.json
          cp /tmp/envelope-inventory/proposed_research_task_record_audit_quarantines.json \
            research_task_record_audit_quarantines.json
          changed="$(git diff --name-only | sort)"
          expected=$'research_task_integrity_quarantines.json\nresearch_task_record_audit_quarantines.json'
          if [[ "$changed" != "$expected" ]]; then
            echo "unexpected generated migration paths:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check
      - name: Commit machine-classified exception migration
        run: |
          set -euo pipefail
          git config user.name "enterprise-math-control-bot"
          git config user.email "enterprise-math-control-bot@users.noreply.github.com"
          git add research_task_integrity_quarantines.json research_task_record_audit_quarantines.json
          git commit -m "[CONTROL] classify post-cutover envelope debt by exact topology"
          git push origin HEAD:control/perfect-prime-publication-quarantine-resolution-20260831
