name: researcher-startup-context-validation

on:
  workflow_dispatch:

jobs:
  startup-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python control_plane/check_context_budget.py
          python -m unittest discover -s tests -p 'test_chatgpt_dispatch_bridge_replay_guard.py'
          python -m unittest discover -s tests -p 'test_researcher_startup_packet*.py'
          python -m unittest -v tests.test_researcher_startup_context_envelope
