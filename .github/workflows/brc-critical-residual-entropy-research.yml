name: brc-critical-residual-entropy-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_CRITICAL_MULTIPLICITY_AUTOMATON_RESIDUAL_ENTROPY_20260903.md'
      - 'experiments/brc_critical_multiplicity_residual_entropy_check.py'
      - '.github/workflows/brc-critical-residual-entropy-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC critical multiplicity residual-entropy checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_critical_multiplicity_residual_entropy_check.py
