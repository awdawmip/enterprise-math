name: coordinate-task-triage-a8d47f21
on:
  push:
    branches: ['maintenance/coordinate-task-triage-20260916-a8d47f21']
    paths: ['.github/workflows/coordinate-task-triage-a8d47f21.yml', 'research_inputs/coordinate_task_triage_20260916/**']
permissions:
  contents: read
  issues: read
jobs:
  snapshot-and-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Exact current-state and publication preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,pathlib,subprocess,zipfile,urllib.request,hashlib,sys,traceback
          from datetime import datetime,timezone
          root=pathlib.Path.cwd();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'coordinate-triage';out.mkdir()
          source=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          comments=[];page=1
          while True:
              req=urllib.request.Request(f'https://api.github.com/repos/awdawmip/enterprise-math/issues/240/comments?per_page=100&page={page}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as res:batch=json.load(res)
              comments.extend(batch)
              if len(batch)<100:break
              page+=1
          events_path=out/'coordination_comments.json';events_path.write_text(json.dumps(comments,ensure_ascii=False))
          sys.path.insert(0,str(root))
          from control_plane import research_control_bootstrap
          research_control_bootstrap.install(root)
          from tools import research_task_records as tr,research_taskbook as tb,research_dispatch as rd
          import research_control_dispatch as cd
          events=rd.load_events(events_path);now=datetime.now(timezone.utc)
          current=tr.current_records(root)
          (out/'current_publications.json').write_text(json.dumps(current,ensure_ascii=False,indent=2))
          (out/'current_task_states.json').write_text(json.dumps(rd.effective_states(events,now=now,root=root),ensure_ascii=False,indent=2))
          (out/'live_route.json').write_text(json.dumps(cd.route_control(events,now=now,kind='ANY',root=root),ensure_ascii=False,indent=2))
          before=tr.audit(root);(out/'baseline_publication_audit.json').write_text(json.dumps(before,ensure_ascii=False,indent=2))
          paths=[p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          selected=[p for p in paths if p.startswith(('docs/','research_result_records/','research_result_reviews/','research_execution_records/','research_driver_followups/','research_objective_heads/','research_artifacts/')) and p.endswith(('.py','.json','.md','.lean','.txt','.csv'))]
          with zipfile.ZipFile(out/'additional_sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in selected:z.write(root/p,p)
          spec_path=root/'research_inputs/coordinate_task_triage_20260916/task_specs.json'
          if spec_path.exists():
              spec=json.loads(spec_path.read_text());added=[];validation=[]
              for task in spec['tasks']:
                  tid=task['meta']['task_id']
                  if tid in current:raise RuntimeError('Refusing duplicate task '+tid)
                  path=root/task['path']
                  if path.exists():raise RuntimeError('Refusing existing taskbook '+str(path))
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_text(tb.render_taskbook(task['meta'],task['body']))
                  commands=[['python','tools/research_task_records.py','prepare','--taskbook',task['path'],'--publisher-role','RESEARCHER','--parent-objective-id',spec['parent_objective_id']],['python','tools/research_taskbook.py','audit',task['path']],['python','tools/research_task_records.py','publish','--taskbook',task['path'],'--publisher-role','RESEARCHER','--publisher-id',spec['publisher_id'],'--research-value',task['research_value']]]
                  for command in commands:
                      proc=subprocess.run(command,text=True,capture_output=True)
                      validation.append({'task_id':tid,'command':command,'exit_code':proc.returncode,'stdout':proc.stdout,'stderr':proc.stderr})
                      (out/'preflight_commands.json').write_text(json.dumps(validation,ensure_ascii=False,indent=2))
                      if proc.returncode:raise RuntimeError('Canonical preflight failed for '+tid+'\n'+proc.stdout+'\n'+proc.stderr)
                  row=tr.current_records(root)[tid]
                  assert row['taskbook_blob_sha1']==tr.taskbook_blob(path)
                  added.extend([task['path'],row['_record_path']])
              after=tr.audit(root)
              (out/'after_publication_audit.json').write_text(json.dumps(after,ensure_ascii=False,indent=2))
              new=sorted(set(after)-set(before))
              if new:raise RuntimeError('New audit errors: '+repr(new))
              with zipfile.ZipFile(out/'validated_publication_payload.zip','w',zipfile.ZIP_DEFLATED) as z:
                  for p in added:z.write(root/p,p)
              (out/'new_publications.json').write_text(json.dumps({tid:row for tid,row in tr.current_records(root).items() if tid not in current},ensure_ascii=False,indent=2))
              (out/'post_preflight_states.json').write_text(json.dumps(rd.effective_states(events,now=datetime.now(timezone.utc),root=root),ensure_ascii=False,indent=2))
          manifest={'snapshot_commit':source,'source_main':'d2984d1a0c5c8221ee103084dd3da68dd039dfaa','observed_at':now.isoformat(),'current_task_count':len(current),'comment_count':len(comments),'baseline_audit_errors':len(before),'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}}
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2));print(json.dumps(manifest,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coordinate-task-triage-preflight
          path: ${{ runner.temp }}/coordinate-triage/
          retention-days: 7
          if-no-files-found: error
