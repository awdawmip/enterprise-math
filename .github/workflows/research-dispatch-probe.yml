name: research-dispatch-probe

on:
  push:
    branches:
      - control/dispatch-probe-20260904-2259
    paths:
      - '.github/workflows/research-dispatch-probe.yml'

permissions:
  contents: read
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch canonical Issue 240 event stream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/240/comments?per_page=100" > /tmp/comment-pages.json
          jq 'add' /tmp/comment-pages.json > /tmp/comments.json
          echo "ISSUE240_COMMENT_COUNT=$(jq 'length' /tmp/comments.json)"
      - name: Run canonical research control dispatcher
        shell: bash
        run: |
          set +e
          python research_control_dispatch.py --events /tmp/comments.json --kind RESEARCH > /tmp/dispatch.json
          status=$?
          set -e
          echo "CANONICAL_RESEARCH_CONTROL_DISPATCH_BEGIN"
          cat /tmp/dispatch.json
          echo "CANONICAL_RESEARCH_CONTROL_DISPATCH_END"
          echo "DISPATCH_EXIT_STATUS=$status"
          if [[ "$status" != "0" && "$status" != "2" ]]; then
            exit "$status"
          fi
