name: X6 centered three-axis slice Foundation

on:
  workflow_dispatch:

jobs:
  centered-slice-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full signed X6 regression
        run: python experiments/x6_signed_native_spatial_v16_20260905/check_x6_signed.py
      - name: Signed BRC regression
        run: python experiments/x6_signed_native_spatial_v16_20260905/check_signed_brc.py
      - name: Centered three-axis slice recomputation
        run: python experiments/x6_centered_three_axis_slice_v19_20260905/check_centered_slice_rebase.py
      - name: Centered slice cross-file consistency
        run: python experiments/x6_centered_three_axis_slice_v19_20260905/check_centered_slice_crossfile.py
      - name: Machine contracts parse
        run: |
          python -m json.tool p000_reality_foundation.json >/dev/null
          python -m json.tool definitions/ENTERPRISE_X6_CENTERED_THREE_AXIS_SLICE_REBASE_20260905.json >/dev/null
