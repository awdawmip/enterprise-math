name: euler-rotation-phase

on:
  pull_request:
    paths:
      - 'research_notes/EULER_CELL_GATE_PHASE_REFINEMENT_20260903.md'
      - 'research_notes/EULER_CAYLEY_DOUBLE_PELL_BRIDGE_20260903.md'
      - 'src/enterprise_math/rotation_phase_refinement.py'
      - 'src/enterprise_math/rotation_cayley_pell.py'
      - 'tests/test_rotation_phase_refinement.py'
      - 'tests/test_rotation_cayley_pell.py'
      - 'research_method_inventory_addenda/20260903_rotation_phase_refinement.json'
      - '.github/workflows/euler-rotation-phase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-certificate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile project subtools
        run: |
          python -m py_compile src/enterprise_math/rotation_phase_refinement.py
          python -m py_compile src/enterprise_math/rotation_cayley_pell.py
      - name: Run isolated Euler rotation-phase regressions
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_rotation_phase_refinement.py' -v
          python -m unittest discover -s tests -p 'test_rotation_cayley_pell.py' -v
      - name: Emit exact certificates
        env:
          PYTHONPATH: src
        run: |
          python -m enterprise_math.rotation_phase_refinement > /tmp/euler-rotation-phase-certificate.json
          python -m enterprise_math.rotation_cayley_pell > /tmp/euler-cayley-pell-certificate.json
