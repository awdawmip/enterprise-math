name: euler-c12-root-torsor-flatness

on:
  pull_request:
    paths:
      - "research_notes/EULER_C12_ROOT_TORSOR_TETRAHEDRAL_FLATNESS_20260904.md"
      - "research_notes/EULER_HOLONOMY_ENDPOINT_RESIDUAL_DUALITY_20260904.md"
      - "research_notes/EULER_UNIFORM_TWISTED_COHOMOLOGY_AND_ENDPOINT_RESIDUAL_20260904.md"
      - "definitions/ENTERPRISE_EULER_C12_ROOT_TORSOR_FLATNESS_THEOREM_LEDGER_20260904.json"
      - "definitions/ENTERPRISE_EULER_HOLONOMY_RESIDUAL_DUALITY_ADDENDUM_20260904.json"
      - "definitions/ENTERPRISE_EULER_TWISTED_ENDPOINT_COHOMOLOGY_ADDENDUM_20260904.json"
      - "research_method_inventory_addenda/20260904_euler_c12_root_torsor.json"
      - "research_method_inventory_addenda/20260904_euler_twisted_endpoint_cohomology.json"
      - "src/enterprise_math/euler_c12_root_torsor.py"
      - "src/enterprise_math/euler_holonomy_residual_duality.py"
      - "src/enterprise_math/euler_twisted_endpoint_cohomology.py"
      - "tests/test_euler_c12_root_torsor.py"
      - "tests/test_euler_holonomy_residual_duality.py"
      - "tests/test_euler_twisted_endpoint_cohomology.py"
      - "EnterpriseMath/Precision/EulerC12RootTorsorFlatness.lean"
      - "EnterpriseMath/Precision/EulerHolonomyResidualDuality.lean"
      - "EnterpriseMath/Precision/EulerTwistedEndpointCohomology.lean"
      - ".github/workflows/euler-c12-root-torsor-flatness.yml"
  workflow_dispatch:

jobs:
  exact-finite-and-formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile exact checkers and tests
        run: >-
          python -m py_compile
          src/enterprise_math/euler_c12_root_torsor.py
          src/enterprise_math/euler_holonomy_residual_duality.py
          src/enterprise_math/euler_twisted_endpoint_cohomology.py
          tests/test_euler_c12_root_torsor.py
          tests/test_euler_holonomy_residual_duality.py
          tests/test_euler_twisted_endpoint_cohomology.py
      - name: Run exhaustive root-cover, flatness, duality, and twisted-cohomology regressions
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest -v
          tests/test_euler_c12_root_torsor.py
          tests/test_euler_holonomy_residual_duality.py
          tests/test_euler_twisted_endpoint_cohomology.py
      - name: Validate theorem and method JSON
        run: |
          python -m json.tool definitions/ENTERPRISE_EULER_C12_ROOT_TORSOR_FLATNESS_THEOREM_LEDGER_20260904.json >/dev/null
          python -m json.tool definitions/ENTERPRISE_EULER_HOLONOMY_RESIDUAL_DUALITY_ADDENDUM_20260904.json >/dev/null
          python -m json.tool definitions/ENTERPRISE_EULER_TWISTED_ENDPOINT_COHOMOLOGY_ADDENDUM_20260904.json >/dev/null
          python -m json.tool research_method_inventory_addenda/20260904_euler_c12_root_torsor.json >/dev/null
          python -m json.tool research_method_inventory_addenda/20260904_euler_twisted_endpoint_cohomology.json >/dev/null
      - name: Reject proof placeholders
        run: |
          if grep -n -E '\b(sorry|admit|axiom)\b' \
            EnterpriseMath/Precision/EulerC12RootTorsorFlatness.lean \
            EnterpriseMath/Precision/EulerHolonomyResidualDuality.lean \
            EnterpriseMath/Precision/EulerTwistedEndpointCohomology.lean; then
            echo "Proof placeholder detected"
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Build C12 root torsor, flatness, residual duality, and twisted cohomology
        run: |
          lake build --wfail -KCI EnterpriseMath.Precision.EulerC12RootTorsorFlatness
          lake build --wfail -KCI EnterpriseMath.Precision.EulerHolonomyResidualDuality
          lake build --wfail -KCI EnterpriseMath.Precision.EulerTwistedEndpointCohomology
