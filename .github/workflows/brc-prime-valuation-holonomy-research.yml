name: brc-prime-valuation-holonomy-research

on:
  pull_request:
    paths:
      - "research_notes/BRC_PRIME_VALUATION_HOLONOMY_MODULE_20260902.md"
      - "experiments/brc_prime_valuation_holonomy_check.py"
      - ".github/workflows/brc-prime-valuation-holonomy-research.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exact BRC prime-valuation holonomy checker
        run: python experiments/brc_prime_valuation_holonomy_check.py
