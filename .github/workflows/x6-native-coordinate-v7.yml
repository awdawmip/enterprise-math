name: X6 native coordinate V7 checks

on:
  pull_request:
    paths:
      - 'research_notes/X6_*'
      - 'experiments/x6_native_coordinate_completion_v7_20260905/**'
      - '.github/workflows/x6-native-coordinate-v7.yml'
  workflow_dispatch:

jobs:
  exact-x6-coordinate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic dependency used by existing V2 cross-check
        run: python -m pip install sympy==1.14.0
      - name: Coordinate completion and V2 cross-check
        run: python experiments/x6_native_coordinate_completion_v7_20260905/check_x6_coordinate.py
      - name: Common-depth cover / cocycle check
        run: python experiments/x6_native_coordinate_completion_v7_20260905/check_x6_cover.py
