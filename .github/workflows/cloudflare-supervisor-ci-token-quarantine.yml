name: cloudflare-supervisor-ci-token-quarantine

on:
  workflow_dispatch:
  push:
    branches:
      - infrastructure/cloudflare-supervisor-v1-20260830
    paths:
      - ".github/workflows/cloudflare-supervisor-ci-token-quarantine.yml"

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-supervisor
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_CI_TOKEN_PREFIX: enterprise-math-supervisor-ci-
    steps:
      - name: Disable every Supervisor CI service token and verify independently
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json")
          tokens="$(curl -fsS "${auth[@]}" "$api/service_tokens?per_page=100")"
          count="$(jq --arg p "$ACCESS_CI_TOKEN_PREFIX" '[.result[]? | select((.name // "") | startswith($p))] | length' <<<"$tokens")"
          echo "SUPERVISOR_CI_TOKEN_COUNT=$count"
          while IFS=$'\t' read -r token_id token_name; do
            [[ -n "$token_id" && -n "$token_name" ]] || continue
            update_file="$(mktemp)"
            update_payload="$(jq -nc --arg name "$token_name" '{name:$name,enabled:false}')"
            update_status="$(curl -sS -o "$update_file" -w '%{http_code}' -X PUT "${auth[@]}" "$api/service_tokens/$token_id" --data "$update_payload")"
            if [[ "$update_status" != "200" || "$(jq -r '.success // false' "$update_file")" != "true" ]]; then
              echo "SUPERVISOR_CI_TOKEN_DISABLE_FAILED id=$token_id http=$update_status"
              jq '{success,errors}' "$update_file" || true
              exit 1
            fi
            verify_file="$(mktemp)"
            verify_status="$(curl -sS -o "$verify_file" -w '%{http_code}' "${auth[@]}" "$api/service_tokens/$token_id")"
            if [[ "$verify_status" != "200" ]] || ! jq -e '.success == true and .result.enabled == false' "$verify_file" >/dev/null; then
              echo "SUPERVISOR_CI_TOKEN_VERIFY_FAILED id=$token_id http=$verify_status"
              jq '{success,result:{id:.result.id,name:.result.name,enabled:.result.enabled,expires_at:.result.expires_at},errors}' "$verify_file" || true
              exit 1
            fi
            echo "SUPERVISOR_CI_TOKEN=DISABLED id=$token_id"
          done < <(jq -r --arg p "$ACCESS_CI_TOKEN_PREFIX" '.result[]? | select((.name // "") | startswith($p)) | [.id,.name] | @tsv' <<<"$tokens")
          echo "SUPERVISOR_CI_TOKEN_QUARANTINE=PASS"
