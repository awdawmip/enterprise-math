name: reference-integrity

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check citation and lineage integrity
        run: python tools/check_references.py
      - name: Check Driver review automatic follow-up tasksets
        run: python research_driver_followup_guard.py audit
      - name: Check shared theorem and tool routing
        run: python tools/check_research_common_surface.py
      - name: Check V1 compatibility task registry and orphan prevention
        run: python tools/research_task_registry.py audit
      - name: Check immutable post-cutover task publication records
        run: python tools/research_task_records.py audit
      - name: Check operational publication selection and retained parallel heads
        run: python research_operational_publications.py audit
      - name: Check immutable execution intents
        run: python tools/research_execution_records.py audit
      - name: Check legacy scheduler cutover is frozen
        run: python tools/check_task_registry_cutover.py
      - name: Check canonical registered-plus-legacy dispatch view
        run: python tools/research_dispatch.py validate
      - name: Check immutable research result and Driver-review records
        run: python tools/research_result_records.py audit
      - name: Check parallel evidence two-pass reference chains
        run: python research_parallel_evidence.py audit
      - name: Check opt-in parallel execution cohorts
        run: python research_execution_cohorts.py audit
      - name: Check cohort completeness and two-pass terminalization
        run: python tools/research_cohort_runtime.py audit
