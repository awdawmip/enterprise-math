name: reference-integrity

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check citation and lineage integrity
        run: python tools/check_references.py
      - name: Check shared theorem and tool routing
        run: python tools/check_research_common_surface.py
      - name: Refresh branch-governance refs
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Audit branch retirement evidence
        run: >-
          python tools/audit_branch_lifecycle.py
          --main refs/remotes/origin/main
          --ref-prefix refs/remotes/origin/
          --json-out /tmp/branch-governance-audit.json
