name: control-alias-repair-validate

on:
  push:
    branches:
      - control/fix-driver-authority-aliases-20260904
    paths:
      - '.github/workflows/control-alias-repair-validate.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enumerate incompatible immutable review schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = "ENTERPRISE_MATH_RESEARCH_RESULT_REVIEW_V1"
          bad = []
          for path in sorted(Path("research_result_reviews").glob("*/*.json")):
              row = json.loads(path.read_text(encoding="utf-8"))
              got = row.get("record_schema")
              if got != expected:
                  bad.append({
                      "path": path.as_posix(),
                      "record_schema": got,
                      "result_id": row.get("result_id"),
                      "review_id": row.get("review_id"),
                      "driver_id": row.get("driver_id"),
                  })
          print(f"BAD_REVIEW_SCHEMA_COUNT={len(bad)}")
          for row in bad:
              print(json.dumps(row, ensure_ascii=False, sort_keys=True))
          PY
