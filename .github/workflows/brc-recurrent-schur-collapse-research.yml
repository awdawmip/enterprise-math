name: brc-recurrent-schur-collapse-research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC recurrent Schur collapse checker
        run: python experiments/brc_recurrent_schur_collapse_check.py
