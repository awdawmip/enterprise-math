name: control-handoff-tail-audit

on:
  push:
    branches:
      - control/terminal-scope-review-barrier-20260907
    paths:
      - '.github/workflows/control-handoff-tail-audit.yml'

permissions:
  contents: write
  issues: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Audit post-0220 HANDOFF shapes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/issues/240/comments?per_page=100" \
            | jq -s 'add | map(select(.created_at >= "2026-09-07T02:20:00Z")) | map(. as $c | (try (.body|fromjson) catch null) as $e | select($e.event == "HANDOFF") | {comment_id:$c.id,created_at:$c.created_at,task_id:$e.task_id,claim_id:$e.claim_id,result_id:($e.result_id//null),handoff_scope:($e.handoff_scope//null),terminal_scope:($e.terminal_scope//null),terminal_candidate:($e.terminal_candidate//null)})'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/control-handoff-tail-audit.yml
          git add .github/workflows/control-handoff-tail-audit.yml
          git commit -m 'control: remove HANDOFF tail audit'
          git push origin HEAD:control/terminal-scope-review-barrier-20260907
