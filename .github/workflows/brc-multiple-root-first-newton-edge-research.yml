name: brc-multiple-root-first-newton-edge-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_MULTIPLE_ROOT_FIRST_NEWTON_EDGE_20260903.md'
      - 'experiments/brc_multiple_root_first_newton_edge_check.py'
      - '.github/workflows/brc-multiple-root-first-newton-edge-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC multiple-root first Newton-edge checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_multiple_root_first_newton_edge_check.py
