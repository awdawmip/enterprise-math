name: euler-cell-polygon-pi

on:
  pull_request:
    paths:
      - "research_notes/EULER_CELL_POLYGON_PI_COMPLETION_20260904.md"
      - "research_notes/EULER_CELL_POLYGON_PI_THEOREM_LEDGER_20260904.json"
      - "EnterpriseMath/Precision/EulerCellPolygonPi.lean"
      - "src/enterprise_math/euler_cell_polygon_pi.py"
      - "tests/test_euler_cell_polygon_pi.py"
      - "research_method_inventory_addenda/20260904_euler_cell_polygon_pi.json"
      - ".github/workflows/euler-cell-polygon-pi.yml"
  workflow_dispatch:

jobs:
  finite-and-formal-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile finite checker
        run: python -m py_compile src/enterprise_math/euler_cell_polygon_pi.py tests/test_euler_cell_polygon_pi.py
      - name: Run isolated polygon regression
        env:
          PYTHONPATH: src
        run: python -m unittest -v tests/test_euler_cell_polygon_pi.py
      - name: Reject proof placeholders
        run: |
          if grep -R -n -E '\b(sorry|admit)\b' EnterpriseMath/Precision/EulerCellPolygonPi.lean; then
            echo "Proof placeholder detected"
            exit 1
          fi
      - name: Build finite Lean polygon identities
        run: lake build --wfail -KCI EnterpriseMath.Precision.EulerCellPolygonPi
