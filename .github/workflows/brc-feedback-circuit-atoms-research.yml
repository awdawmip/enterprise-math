name: brc-feedback-circuit-atoms-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_FEEDBACK_CIRCUIT_ATOMS_AND_INTERACTION_GIRTH_20260903.md'
      - 'experiments/brc_feedback_circuit_atoms_check.py'
      - '.github/workflows/brc-feedback-circuit-atoms-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC feedback circuit atom checker
        run: python experiments/brc_feedback_circuit_atoms_check.py
