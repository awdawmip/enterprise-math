name: brc-critical-degeneracy-matrix-asymptotic-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_CRITICAL_DEGENERACY_MATRIX_MOMENT_ASYMPTOTIC_20260903.md'
      - 'experiments/brc_critical_degeneracy_matrix_moment_asymptotic_check.py'
      - '.github/workflows/brc-critical-degeneracy-matrix-asymptotic-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC critical-degeneracy matrix asymptotic checker
        run: python experiments/brc_critical_degeneracy_matrix_moment_asymptotic_check.py
