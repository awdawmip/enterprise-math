name: RH log3 second-moment 57 certificate

on:
  pull_request:
    paths:
      - 'scripts/rh_log3_second_moment_57_arb.py'
      - '.github/workflows/rh-log3-second-moment-57.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install rigorous ball arithmetic backend
        run: python -m pip install --disable-pip-version-check 'python-flint==0.9.0'
      - name: Run Arb second-moment certificate
        run: python scripts/rh_log3_second_moment_57_arb.py
