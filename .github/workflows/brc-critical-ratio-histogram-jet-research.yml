name: brc-critical-ratio-histogram-jet-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_CRITICAL_RATIO_HISTOGRAM_FINITE_JET_20260903.md'
      - 'experiments/brc_critical_ratio_histogram_jet_check.py'
      - '.github/workflows/brc-critical-ratio-histogram-jet-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC critical ratio histogram finite-jet checker
        env:
          PYTHONPATH: src
        run: python experiments/brc_critical_ratio_histogram_jet_check.py
