name: CFD host 20260916 bounded integration
on:
  push:
    branches: [research/cfd-host-20260916-68a17c]
    paths: [.github/workflows/cfd-host-20260916.yml]
permissions:
  contents: write
  issues: read
concurrency:
  group: cfd-host-20260916-68a17c
  cancel-in-progress: false
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: work
      - name: Authorize current claim with unchanged canonical runtime guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/research_notes/CFD9R2K7/host_20260916
          gh api --paginate --slurp 'repos/awdawmip/enterprise-math/issues/240/comments?per_page=100' > "$RUNNER_TEMP/pages.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']); pages=json.loads((p/'pages.json').read_text())
          (p/'events.json').write_text(json.dumps([r for page in pages for r in page]))
          state={'task':{'task_id':'RS-CFD-SPECTRAL-HYBRID-20260910'},'owner_claim':{'claim_id':'CFD9R2K7-HOST-20260916','researcher_id':'EM-CFD-49157B'},'session_id':'local-cfd-host-20260916-68a17c','activity_id':'RA-CFD-HOST-20260916-68a17c','research_mode':'TASK_RESEARCH'}
          (p/'state.json').write_text(json.dumps(state))
          PY
          set +e
          python - <<'PY' > "$RUNNER_TEMP/guard-output.txt" 2>&1
          import sys,os,runpy
          from pathlib import Path
          sys.path.insert(0,str(Path('control').resolve()))
          from control_plane.research_control_bootstrap import install
          install(); p=Path(os.environ['RUNNER_TEMP'])
          sys.argv=['control/tools/research_runtime_guard.py','authorize','--state-file',str(p/'state.json'),'--events',str(p/'events.json')]
          runpy.run_path('control/tools/research_runtime_guard.py',run_name='__main__')
          PY
          export GUARD_EXIT_CODE="$?"
          set -e
          python - <<'PY'
          import json,os,hashlib,subprocess,datetime
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']); raw=(p/'guard-output.txt').read_text()
          try: result=json.loads(raw)
          except ValueError: result=None
          value={'schema':'CFD_EXACT_CANONICAL_GUARD_OBSERVATION_V1','task_id':'RS-CFD-SPECTRAL-HYBRID-20260910','claim_id':'CFD9R2K7-HOST-20260916','researcher_id':'EM-CFD-49157B','source_sha':os.environ['GITHUB_SHA'],'control_sha':subprocess.check_output(['git','-C','control','rev-parse','HEAD'],text=True).strip(),'workflow_run_id':os.environ['GITHUB_RUN_ID'],'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'guard_exit_code':int(os.environ['GUARD_EXIT_CODE']),'guard_result':result,'raw_guard_output':raw,'server_comment_count':len(json.loads((p/'events.json').read_text())),'server_comments_sha256':hashlib.sha256((p/'events.json').read_bytes()).hexdigest()}
          out=Path('work/research_notes/CFD9R2K7/host_20260916')/('authorization_'+os.environ['GITHUB_RUN_ID']+'.json')
          out.write_text(json.dumps(value,indent=2)+'\n'); print(json.dumps(value,indent=2))
          assert int(os.environ['GUARD_EXIT_CODE']) == 0 and result and result.get('authorized') is True
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cfd-host-ubuntu24-py311-numpy126-shenfun430-scipy1153-v1
      - uses: actions/checkout@v4
        with:
          repository: spectralDNS/spectralDNS
          ref: 835b01b1e820b5c56559b9a028293e57526bfbf9
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e40e5303234c5e8bd725528aad9bff9edf0c059d
          path: prior
          persist-credentials: false
      - name: Install real MPI FFTW and version-compatible pinned dependencies
        id: dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenmpi-dev openmpi-bin libfftw3-dev
          python -m pip install 'numpy==1.26.4' 'scipy==1.15.3' 'sympy==1.13.3' 'Cython==3.0.12' 'setuptools<75' wheel
          python -m pip install 'mpi4py==4.0.3' 'mpi4py-fft==2.0.6' 'shenfun==4.3.0' 'numba==0.61.2' 'h5py==3.12.1' 'PyYAML==6.0.2' 'psutil==6.1.1'
          python -m pip freeze > work/research_notes/CFD9R2K7/host_20260916/environment_numba.txt
      - name: Execute matched upstream-Numba native host comparison
        id: benchmark
        run: |
          set -euo pipefail
          export CFD_UPSTREAM_ROOT="$GITHUB_WORKSPACE/upstream"
          export CFD_PRIOR_ROOT="$GITHUB_WORKSPACE/prior"
          python work/research_notes/CFD9R2K7/host_20260916/run_numba_variant.py 2>&1 | tee work/research_notes/CFD9R2K7/host_20260916/native_numba_run.log
      - name: Persist bounded outputs including failures
        if: always()
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          python - <<'PY'
          import json,os,datetime
          from pathlib import Path
          p=Path('work/research_notes/CFD9R2K7/host_20260916'); p.mkdir(parents=True,exist_ok=True)
          (p/('run_'+os.environ['GITHUB_RUN_ID']+'.json')).write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],'variant':'upstream-numba','guard_outcome':os.environ['GUARD_OUTCOME'],'dependencies_outcome':os.environ['DEPENDENCIES_OUTCOME'],'benchmark_outcome':os.environ['BENCHMARK_OUTCOME'],'recorded_at':datetime.datetime.now(datetime.timezone.utc).isoformat()},indent=2)+'\n')
          PY
          cd work
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find research_notes/CFD9R2K7/host_20260916 -type d -name __pycache__ -prune -exec rm -rf {} +
          git add research_notes/CFD9R2K7/host_20260916/
          git diff --cached --quiet || git commit -m 'cfd: preserve upstream-Numba comparison without erasing default evidence'
          git push origin HEAD:refs/heads/research/cfd-host-20260916-68a17c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfd-host-${{ github.run_id }}
          path: work/research_notes/CFD9R2K7/host_20260916/
