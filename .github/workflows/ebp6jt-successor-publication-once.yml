name: ebp6jt-successor-publication-once
on:
  push:
    branches: ['handoff/ebp6jt-successors-20260909-25c94a']
    paths: ['handoff_requests/ebp6jt_20260909/request.json']
permissions:
  contents: write
concurrency:
  group: ebp6jt-successor-publication-20260909
  cancel-in-progress: false
jobs:
  publish-on-owned-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run canonical task publication tools
        run: python handoff_requests/ebp6jt_20260909/publish_once.py
      - name: Commit validated publication transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_tasks/ENTERPRISE_BRC_HALF_COUPLING_INERT_PLUS_UR_LEGENDRE_RECIPROCITY_20260909.md
          git add research_tasks/ENTERPRISE_BRC_HALF_COUPLING_INERT_PLUS_QTF3_LIFT_20260909.md
          git add research_task_records/RS-ENTERPRISE-BRC-HALF-COUPLING-INERT-PLUS-UR-LEGENDRE-RECIPROCITY
          git add research_task_records/RS-ENTERPRISE-BRC-HALF-COUPLING-INERT-PLUS-QTF3-LIFT
          git add research_handoffs/ENTERPRISE_BRC_HALF_COUPLING_INERT_PLUS_JACOBI_JET_20260909
          git add handoff_requests/ebp6jt_20260909
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish EBP6JT UR-Legendre and QTF3 successor tasks'
          git push origin "HEAD:refs/heads/handoff/ebp6jt-successors-20260909-25c94a"
