name: control-invalid-done-guard-patch

on:
  push:
    branches:
      - control/result-handoff-awaiting-review-20260906
    paths:
      - '.github/workflows/control-invalid-done-guard-patch.yml'
      - 'control_plane/apply_invalid_done_guard_patch.py'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'bootstrap transient invalid DONE guard patch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply invalid DONE fail-closed guard
        run: python control_plane/apply_invalid_done_guard_patch.py
      - name: Run focused control regressions
        run: |
          python -m unittest discover -s tests -p 'test_research_runtime_reducer.py'
          python -m unittest discover -s tests -p 'test_result_handoff_dispatch_guard.py'
          python -m unittest discover -s tests -p 'test_registered_done_dispatch_guard.py'
      - name: Commit repaired control plane
        run: |
          set -euo pipefail
          rm control_plane/apply_invalid_done_guard_patch.py
          rm .github/workflows/control-invalid-done-guard-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/research_dispatch.py tests/test_registered_done_dispatch_guard.py control_plane/apply_invalid_done_guard_patch.py .github/workflows/control-invalid-done-guard-patch.yml
          git commit -m 'control: block unreviewed registered DONE from fresh dispatch'
          git push origin HEAD:control/result-handoff-awaiting-review-20260906
