name: r023-lean-local

on:
  push:
    branches:
      - agent/r023-brc-semantic-lean-core

jobs:
  lean-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        run: lake exe cache get
      - name: Compile R023 owner-local module
        run: lake env lean -DwarningAsError=true EnterpriseMath/Relation/BranchRecoalescence.lean
