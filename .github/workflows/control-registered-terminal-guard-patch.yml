name: control-registered-terminal-guard-patch

on:
  push:
    branches:
      - control/terminal-scope-review-barrier-20260907
    paths:
      - '.github/workflows/control-registered-terminal-guard-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch and test registered terminal guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/research_dispatch.py')
          s = p.read_text(encoding='utf-8')

          old = 'import copy\nfrom pathlib import Path\nfrom typing import Any\n'
          new = 'import copy\nfrom datetime import datetime, timezone\nfrom pathlib import Path\nfrom typing import Any\n'
          assert s.count(old) == 1, ('import anchor', s.count(old))
          s = s.replace(old, new, 1)

          old = '_ORIGINAL_FILTER_REGISTERED_EVENTS = _core._filter_registered_events\n_AUTO_RESULT_STATE = object()\n'
          new = '''_ORIGINAL_FILTER_REGISTERED_EVENTS = _core._filter_registered_events\n_ORIGINAL_BLOCK_UNREVIEWED_REGISTERED_DONE = _core._block_unreviewed_registered_done\n_AUTO_RESULT_STATE = object()\n\n# Audited compatibility boundary: after this GitHub-server timestamp there were\n# exactly two HANDOFFs before enforcement was added: one structurally ambiguous\n# PCF return and one already-structured P021 frozen return. No plain continuation\n# exists in the audited interval.\nHANDOFF_SCOPE_CUTOVER = datetime(2026, 9, 7, 2, 20, tzinfo=timezone.utc)\nHANDOFF_SCOPE_CONTINUATION = "CONTINUATION"\nHANDOFF_SCOPE_FROZEN_RETURN = "FROZEN_RETURN_AWAITING_DRIVER_REVIEW"\nDRIVER_REVIEW_TERMINAL_SCOPE = "RESEARCH_RETURN_FROZEN_AWAITING_DRIVER_REVIEW"\nHANDOFF_SCOPE_REASON_PREFIX = "registered HANDOFF scope contract:"\n'''
          assert s.count(old) == 1, ('constant anchor', s.count(old))
          s = s.replace(old, new, 1)

          marker = '\ndef _filter_registered_events(\n'
          assert s.count(marker) == 1, ('filter marker', s.count(marker))
          helper = r'''

def _registered_handoff_scope_reason(event: dict[str, Any]) -> str | None:
    """Return a post-cutover structural HANDOFF defect, never a prose inference."""
    if event.get("event") != "HANDOFF":
        return None
    meta = event.get(_core.GITHUB_META_KEY)
    created_at = meta.get("created_at") if isinstance(meta, dict) else None
    try:
        created = _core.research_runtime_reducer.parse_time(created_at)
    except Exception:
        return f"{HANDOFF_SCOPE_REASON_PREFIX} invalid authenticated created_at"
    if created < HANDOFF_SCOPE_CUTOVER:
        return None

    result_id = event.get("result_id")
    if result_id is not None and (
        not isinstance(result_id, str) or not result_id.strip()
    ):
        return f"{HANDOFF_SCOPE_REASON_PREFIX} result_id must be a nonempty string when supplied"

    handoff_scope = event.get("handoff_scope")
    if handoff_scope is not None and handoff_scope not in {
        HANDOFF_SCOPE_CONTINUATION,
        HANDOFF_SCOPE_FROZEN_RETURN,
    }:
        return f"{HANDOFF_SCOPE_REASON_PREFIX} invalid handoff_scope"

    terminal_scope = event.get("terminal_scope")
    if terminal_scope is not None and terminal_scope != DRIVER_REVIEW_TERMINAL_SCOPE:
        return f"{HANDOFF_SCOPE_REASON_PREFIX} invalid terminal_scope"

    # terminal_candidate is historical compatibility only in the reducer. New
    # registered producers must use handoff_scope/result_id/terminal_scope.
    if event.get("terminal_candidate") is not None:
        return f"{HANDOFF_SCOPE_REASON_PREFIX} terminal_candidate is legacy-only after cutover"

    frozen_marker = (
        isinstance(result_id, str)
        and bool(result_id.strip())
    ) or terminal_scope == DRIVER_REVIEW_TERMINAL_SCOPE or (
        handoff_scope == HANDOFF_SCOPE_FROZEN_RETURN
    )

    if handoff_scope == HANDOFF_SCOPE_CONTINUATION and frozen_marker:
        return f"{HANDOFF_SCOPE_REASON_PREFIX} CONTINUATION contradicts frozen-return marker"
    if handoff_scope == HANDOFF_SCOPE_CONTINUATION or frozen_marker:
        return None
    return f"{HANDOFF_SCOPE_REASON_PREFIX} explicit machine scope required after cutover"


def _enforce_registered_handoff_scopes(
    events: list[dict[str, Any]],
    accepted: list[dict[str, Any]],
    rejected: list[dict[str, Any]],
) -> tuple[list[dict[str, Any]], list[dict[str, Any]]]:
    kept: list[dict[str, Any]] = []
    extra_rejected = list(rejected)
    for event in accepted:
        reason = _registered_handoff_scope_reason(event)
        if reason is None:
            kept.append(event)
            continue
        index = _event_source_index(event, events)
        extra_rejected.append(
            {"index": index if index is not None else 0, "reason": reason}
        )
    return kept, extra_rejected


def _event_had_live_claim(
    task: dict[str, Any],
    event: dict[str, Any],
    reduced_task_events: list[dict[str, Any]] | None,
) -> bool:
    """Whether this rejected terminal event belonged to the live claim then."""
    if reduced_task_events is None:
        # Direct legacy callers lack replay context; preserve conservative behavior.
        return True
    claim_id = event.get("claim_id")
    if not isinstance(claim_id, str) or not claim_id:
        return False
    meta = event.get(_core.GITHUB_META_KEY)
    comment_id = meta.get("comment_id") if isinstance(meta, dict) else None
    created_at = meta.get("created_at") if isinstance(meta, dict) else None
    if type(comment_id) is not int or not isinstance(created_at, str):
        return False
    try:
        event_at = _core.research_runtime_reducer.parse_time(created_at)
    except Exception:
        return False
    prior: list[dict[str, Any]] = []
    for candidate in reduced_task_events:
        candidate_meta = candidate.get(_core.GITHUB_META_KEY)
        candidate_id = (
            candidate_meta.get("comment_id") if isinstance(candidate_meta, dict) else None
        )
        if type(candidate_id) is int and candidate_id < comment_id:
            prior.append(candidate)
    try:
        prior_state = _core.research_runtime_reducer.reduce_task(
            task,
            prior,
            default_lease_minutes=_core.load_policy().get("default_lease_minutes", 90),
            now=event_at,
        )
    except Exception:
        return False
    return (
        prior_state.get("dispatch_state") == "LEASED"
        and prior_state.get("claim_id") == claim_id
    )


def _later_applied_event_exists(
    event: dict[str, Any],
    reduced_task_events: list[dict[str, Any]] | None,
    reducer_ignored_indices: set[int] | None,
) -> bool:
    if reduced_task_events is None:
        return False
    meta = event.get(_core.GITHUB_META_KEY)
    comment_id = meta.get("comment_id") if isinstance(meta, dict) else None
    if type(comment_id) is not int:
        return False
    ignored = reducer_ignored_indices or set()
    for reduced_index, reduced_event in enumerate(reduced_task_events):
        if reduced_index in ignored:
            continue
        reduced_meta = reduced_event.get(_core.GITHUB_META_KEY)
        reduced_comment_id = (
            reduced_meta.get("comment_id") if isinstance(reduced_meta, dict) else None
        )
        if type(reduced_comment_id) is int and reduced_comment_id > comment_id:
            return True
    return False
'''
          s = s.replace(marker, helper + marker, 1)

          old = '    return _bind_intent_claim_publications(task, events, accepted, rejected, root)\n\n\ndef _post_review_runtime_transition(\n'
          new = '''    accepted, rejected = _bind_intent_claim_publications(\n        task, events, accepted, rejected, root\n    )\n    return _enforce_registered_handoff_scopes(events, accepted, rejected)\n\n\ndef _block_ambiguous_registered_handoff(\n    task: dict[str, Any],\n    state: dict[str, Any],\n    authenticated: list[dict[str, Any]],\n    registered_rejected: list[dict[str, Any]],\n    result_state: dict[str, Any] | None,\n    reduced_task_events: list[dict[str, Any]] | None = None,\n    reducer_ignored_indices: set[int] | None = None,\n) -> dict[str, Any]:\n    if result_state is not None or state.get("dispatch_state") != "NEEDS_DISPATCH":\n        return state\n    for rejected in registered_rejected:\n        reason = rejected.get("reason")\n        if not isinstance(reason, str) or not reason.startswith(HANDOFF_SCOPE_REASON_PREFIX):\n            continue\n        index = rejected.get("index")\n        if type(index) is not int or index < 0 or index >= len(authenticated):\n            continue\n        event = authenticated[index]\n        if event.get("task_id") != task.get("task_id") or event.get("event") != "HANDOFF":\n            continue\n        if not _event_had_live_claim(task, event, reduced_task_events):\n            continue\n        if _later_applied_event_exists(\n            event, reduced_task_events, reducer_ignored_indices\n        ):\n            continue\n        meta = event.get(_core.GITHUB_META_KEY)\n        value = copy.deepcopy(state)\n        value["state"] = "BLOCKED"\n        value["dispatch_state"] = "BLOCKED"\n        value["hard_block"] = {\n            "code": "REGISTERED_HANDOFF_SCOPE_REQUIRED",\n            "publication_id": task.get("publication_id"),\n            "claim_id": event.get("claim_id"),\n            "server_comment_id": (\n                meta.get("comment_id") if isinstance(meta, dict) else None\n            ),\n            "reason": reason,\n        }\n        value["next_action"] = (\n            "Append a structurally scoped HANDOFF correction while the original owner "\n            "lease is valid, or append an authorized lifecycle correction; do not "\n            "redispatch this ambiguous handoff."\n        )\n        return value\n    return state\n\n\ndef _block_unreviewed_registered_done(\n    task: dict[str, Any],\n    state: dict[str, Any],\n    authenticated: list[dict[str, Any]],\n    registered_rejected: list[dict[str, Any]],\n    result_state: dict[str, Any] | None,\n    reduced_task_events: list[dict[str, Any]] | None = None,\n    reducer_ignored_indices: set[int] | None = None,\n) -> dict[str, Any]:\n    terminal_reason = "registered DONE requires a frozen result with terminal Driver review"\n    eligible_rejected: list[dict[str, Any]] = []\n    for rejected in registered_rejected:\n        if rejected.get("reason") != terminal_reason:\n            eligible_rejected.append(rejected)\n            continue\n        index = rejected.get("index")\n        if type(index) is not int or index < 0 or index >= len(authenticated):\n            continue\n        event = authenticated[index]\n        if _event_had_live_claim(task, event, reduced_task_events):\n            eligible_rejected.append(rejected)\n    value = _ORIGINAL_BLOCK_UNREVIEWED_REGISTERED_DONE(\n        task,\n        state,\n        authenticated,\n        eligible_rejected,\n        result_state,\n        reduced_task_events,\n        reducer_ignored_indices,\n    )\n    return _block_ambiguous_registered_handoff(\n        task,\n        value,\n        authenticated,\n        registered_rejected,\n        result_state,\n        reduced_task_events,\n        reducer_ignored_indices,\n    )\n\n\ndef _post_review_runtime_transition(\n'''
          assert s.count(old) == 1, ('filter return anchor', s.count(old))
          s = s.replace(old, new, 1)

          old = '_core._filter_registered_events = _filter_registered_events\n_core._overlay_result_state = _overlay_result_state\n'
          new = '''_core._filter_registered_events = _filter_registered_events\n_core._overlay_result_state = _overlay_result_state\n_core._block_unreviewed_registered_done = _block_unreviewed_registered_done\n'''
          assert s.count(old) == 1, ('monkeypatch anchor', s.count(old))
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          python -m unittest -v \
            tests.test_registered_handoff_scope_guard \
            tests.test_result_handoff_dispatch_guard \
            tests.test_registered_done_dispatch_guard \
            tests.test_control_plane_adversarial_simulation \
            tests.test_chatgpt_dispatch_bridge_replay_guard

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/control-registered-terminal-guard-patch.yml
          git add tools/research_dispatch.py .github/workflows/control-registered-terminal-guard-patch.yml
          git commit -m 'control: bind terminal blockers to live claims'
          git push origin HEAD:control/terminal-scope-review-barrier-20260907
