name: brc-feedback-condensation-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_FEEDBACK_CONDENSATION_EXACT_UPDATE_20260903.md'
      - 'experiments/brc_feedback_condensation_check.py'
      - '.github/workflows/brc-feedback-condensation-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC feedback condensation checker
        run: python experiments/brc_feedback_condensation_check.py
