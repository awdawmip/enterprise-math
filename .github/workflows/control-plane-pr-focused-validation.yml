name: control-plane-pr-focused-validation

on:
  pull_request:
    paths:
      - 'tools/research_dispatch.py'
      - 'research_control_dispatch.py'
      - 'research_driver_followup.py'
      - 'tools/research_result_records.py'
      - 'tests/test_task_scope_portfolio_followup.py'
      - 'control_plane/research_task_assignment.py'
      - 'control_plane/research_dependency_release.py'
      - 'tests/test_assigned_research_task_dispatch.py'
      - 'tests/test_research_dependency_release.py'
      - 'tools/research_runtime.py'
      - 'tools/research_runtime_reducer.py'
      - '.github/workflows/chatgpt-control-dispatch-bridge.yml'
      - 'tests/test_control_plane_adversarial_simulation.py'
      - 'tests/test_chatgpt_dispatch_bridge_replay_guard.py'
      - 'tests/test_result_handoff_dispatch_guard.py'
      - 'tests/test_registered_done_dispatch_guard.py'
      - 'tests/test_registered_handoff_scope_guard.py'
      - 'tests/test_result_reopen_runtime_precedence.py'
      - 'tests/test_control_dispatch_session_observation_time.py'
      - 'tests/test_execution_intent_publication_gate.py'
      - 'tests/test_registered_event_publication_time_gate.py'
      - 'tests/test_registered_event_control_composition_20260908.py'
      - '.github/workflows/control-plane-pr-focused-validation.yml'

jobs:
  focused-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python -m unittest -v tests.test_assigned_research_task_dispatch
          python -m unittest -v tests.test_research_dependency_release
          python -m unittest -v tests.test_task_scope_portfolio_followup
          python -m unittest -v tests.test_assigned_governance_driver_dispatch
          python -m unittest -v tests.test_control_plane_adversarial_simulation
          python -m unittest -v tests.test_chatgpt_dispatch_bridge_replay_guard
          python -m unittest -v tests.test_result_handoff_dispatch_guard
          python -m unittest -v tests.test_registered_done_dispatch_guard
          python -m unittest -v tests.test_registered_handoff_scope_guard
          python -m unittest -v tests.test_result_reopen_runtime_precedence
          python -m unittest -v tests.test_control_dispatch_session_observation_time
          python -m unittest -v tests.test_execution_intent_publication_gate
          python -m unittest -v tests.test_registered_event_publication_time_gate
          python -m unittest -v tests.test_registered_event_control_composition_20260908
