name: brc-moment-length-port-transfer-research

on:
  pull_request:
    paths:
      - 'research_notes/BRC_MOMENT_LENGTH_SAFE_PORT_TRANSFER_20260903.md'
      - 'experiments/brc_moment_length_safe_port_transfer_check.py'
      - '.github/workflows/brc-moment-length-port-transfer-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact BRC moment/length-safe port checker
        run: python experiments/brc_moment_length_safe_port_transfer_check.py
