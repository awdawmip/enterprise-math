name: brc-newton-handoff-resonance-foundation

on:
  pull_request:
    paths:
      - 'definitions/ENTERPRISE_BRC_NEWTON_HANDOFF_RESONANCE_FOUNDATION_20260904.md'
      - 'definitions/ENTERPRISE_BRC_NEWTON_HANDOFF_RESONANCE_THEOREM_LEDGER_20260904.json'
      - 'definitions/ENTERPRISE_BRC_WEIGHTED_GLOBAL_SUBSTRATE_20260902.json'
      - 'research_method_inventory_addenda/20260904_brc_newton_handoff_resonance_foundation.json'
      - 'src/enterprise_math/brc_newton_handoff.py'
      - 'tests/test_brc_newton_handoff_resonance_foundation.py'
      - 'experiments/check_brc_newton_handoff_resonance_foundation.py'
      - '.github/workflows/brc-newton-handoff-resonance-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Newton handoff/resonance production subtool
        env:
          PYTHONPATH: src
        run: python -m unittest tests/test_brc_newton_handoff_resonance_foundation.py
      - name: Newton handoff/resonance Foundation integrity
        env:
          PYTHONPATH: src
        run: python experiments/check_brc_newton_handoff_resonance_foundation.py
      - name: Single-generator root-handoff research regression
        env:
          PYTHONPATH: src
        run: python experiments/brc_single_generator_root_handoff_check.py
      - name: Newton scale-resonance research regression
        env:
          PYTHONPATH: src
        run: python experiments/brc_newton_scale_resonance_pushforward_check.py
      - name: Parent Newton-recursion Foundation remains consistent
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests/test_brc_newton_recursion_foundation.py
          python experiments/check_brc_newton_recursion_foundation.py
      - name: Toolbox discovers Newton handoff/resonance BRC
        run: |
          python tools/enterprise_toolbox.py --json methods newton handoff resonance brc > /tmp/brc_handoff_method.json
          grep -q 't0.weighted_brc_newton_handoff_resonance' /tmp/brc_handoff_method.json
          python tools/enterprise_toolbox.py --json modules newton handoff resonance brc > /tmp/brc_handoff_module.json
          grep -q 'brc_newton_handoff' /tmp/brc_handoff_module.json
