name: brc-newton-observer-lattice-foundation

on:
  pull_request:
    paths:
      - 'definitions/ENTERPRISE_BRC_NEWTON_OBSERVER_LATTICE_FOUNDATION_20260904.md'
      - 'definitions/ENTERPRISE_BRC_NEWTON_OBSERVER_LATTICE_THEOREM_LEDGER_20260904.json'
      - 'definitions/ENTERPRISE_BRC_WEIGHTED_GLOBAL_SUBSTRATE_20260902.json'
      - 'research_method_inventory_addenda/20260904_brc_newton_observer_lattice_foundation.json'
      - 'src/enterprise_math/brc_newton_observer_lattice.py'
      - 'tests/test_brc_newton_observer_lattice_foundation.py'
      - 'experiments/check_brc_newton_observer_lattice_foundation.py'
      - '.github/workflows/brc-newton-observer-lattice-foundation.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Newton observer lattice production subtool
        env:
          PYTHONPATH: src
        run: python -m unittest tests/test_brc_newton_observer_lattice_foundation.py
      - name: Newton observer lattice Foundation integrity
        env:
          PYTHONPATH: src
        run: python experiments/check_brc_newton_observer_lattice_foundation.py
      - name: Newton observer lattice research regression
        env:
          PYTHONPATH: src
        run: python experiments/brc_newton_observer_lattice_check.py
      - name: Parent Newton fiber quotient Foundation remains consistent
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests/test_brc_newton_fiber_quotient_foundation.py
          python experiments/check_brc_newton_fiber_quotient_foundation.py
      - name: Toolbox discovers Newton observer lattice BRC
        env:
          PYTHONPATH: src
        run: |
          python tools/enterprise_toolbox.py --json methods observer lattice newton brc > /tmp/observer.json
          grep -q 't0.weighted_brc_newton_observer_lattice' /tmp/observer.json
          python tools/enterprise_toolbox.py --json modules observer lattice newton brc > /tmp/observer-module.json
          grep -q 'module:brc_newton_observer_lattice' /tmp/observer-module.json
