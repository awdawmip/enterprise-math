name: 研究问题
description: 分享开放问题、观察、证明、计算或前人工作线索
title: "[研究] "
body:
  - type: input
    id: problem
    attributes:
      label: 问题编号
      description: 能对应已有问题时，请使用类似 P003 的编号。
  - type: dropdown
    id: status
    attributes:
      label: 结论状态（如适用）
      description: 开放问题或尚无确定命题的探索可以留空。
      options:
        - DEFINITION
        - PROVED
        - CONJECTURE
        - COMPUTATIONAL
        - PHYSICAL-HYPOTHESIS
  - type: textarea
    id: statement
    attributes:
      label: 问题、命题或观察
      description: 说明问题或观察及相关前提；开放探索无需预先形成定理表述。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据或论证
      description: 可以包含证明步骤、计算结果或前人资料。
  - type: textarea
    id: next
    attributes:
      label: 接续方向（如已知）
      description: 已有有价值的后续问题或动作时再填写。
