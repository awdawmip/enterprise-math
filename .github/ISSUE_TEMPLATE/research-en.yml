name: Research problem
description: Share an open question, observation, proof, computation, or prior-art lead
title: "[Research] "
body:
  - type: input
    id: problem
    attributes:
      label: Problem ID
      description: Use an existing ID such as P003 when possible.
  - type: dropdown
    id: status
    attributes:
      label: Claim status, if applicable
      description: Leave this empty for an open question or an exploration without a settled claim.
      options:
        - DEFINITION
        - PROVED
        - CONJECTURE
        - COMPUTATIONAL
        - PHYSICAL-HYPOTHESIS
  - type: textarea
    id: statement
    attributes:
      label: Question, claim, or observation
      description: Describe the question or observation and its relevant assumptions. An open exploration does not need a theorem statement.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or argument
      description: Include proof steps, computation, or prior-art sources.
  - type: textarea
    id: next
    attributes:
      label: Continuation, if known
      description: Add a useful next question or contribution when one is known.
