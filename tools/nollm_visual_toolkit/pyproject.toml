[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nollm-visual-toolkit"
version = "0.3.0"
description = "Offline typed research visualization with self-contained HTML generation and local preview"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Enterprise Math research contributors"}]
dependencies = []

[project.optional-dependencies]
static = ["matplotlib>=3.6"]

[project.scripts]
nollm-viz = "nollm_visual_toolkit.__main__:main"

[tool.setuptools.packages.find]
include = ["nollm_visual_toolkit*"]

[tool.setuptools.package-data]
nollm_visual_toolkit = ["workbench.html"]
